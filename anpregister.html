<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ANP MONEY - Partner Registration</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: #020b05;
            -webkit-tap-highlight-color: transparent;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient Floating Cyber Orbs */
        .orb-1 {
            position: absolute;
            top: -10%;
            left: -10%;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(16,185,129,0.2) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            animation: floatOrb 8s infinite alternate ease-in-out;
            pointer-events: none;
        }
        .orb-2 {
            position: absolute;
            bottom: -10%;
            right: -10%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(5,150,105,0.15) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            animation: floatOrb 10s infinite alternate-reverse ease-in-out;
            pointer-events: none;
        }
        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 40px) scale(1.1); }
        }

        .glass-card {
            background: rgba(10, 24, 15, 0.75);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 30px 60px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.1);
        }

        @keyframes slideDown {
            0% { opacity: 0; transform: translateY(-20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideUp {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-logo { animation: slideDown 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-form { animation: slideUp 0.6s 0.15s cubic-bezier(0.16, 1, 0.3, 1) both; }

        @keyframes shimmerBtn {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        .btn-shimmer {
            position: relative;
            overflow: hidden;
        }
        .btn-shimmer::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transform: translateX(-100%);
            animation: shimmerBtn 3s infinite;
        }

        @keyframes circleScale {
            0% { transform: scale(0); opacity: 0; }
            60% { transform: scale(1.12); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes checkmarkDraw {
            0% { stroke-dashoffset: 48; }
            100% { stroke-dashoffset: 0; }
        }
        .gpay-circle { animation: circleScale 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .gpay-check { stroke-dasharray: 48; stroke-dashoffset: 48; animation: checkmarkDraw 0.4s 0.25s ease-in-out forwards; }

        .app-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="orb-1"></div>
    <div class="orb-2"></div>

    <div class="app-container">
        <div class="glass-card rounded-[36px] p-8 text-white shadow-2xl relative overflow-hidden">
            
            <div class="text-center mb-6 animate-logo">
                <div class="w-14 h-14 bg-gradient-to-br from-green-400 to-emerald-600 rounded-2xl flex items-center justify-center mx-auto mb-3 text-white text-xl shadow-[0_10px_25px_rgba(34,197,94,0.4)] transform hover:scale-105 transition-transform duration-300">
                    <i class="fas fa-user-plus"></i>
                </div>
                <h2 class="text-2xl font-black tracking-tight text-white">Partner Registration</h2>
                <p class="text-xs text-gray-300 mt-1 font-medium">Create your ANP Green Ride account</p>
            </div>

            <div class="flex flex-col gap-3.5 mb-5 animate-form">
                <div>
                    <label class="text-[11px] text-green-300 font-bold tracking-wide uppercase mb-1 block">Full Name</label>
                    <input type="text" id="reg-name" placeholder="John Doe" class="w-full bg-black/50 border border-white/15 rounded-2xl px-4 py-3 text-xs text-white outline-none focus:border-green-400 focus:ring-2 focus:ring-green-400/30 focus:-translate-y-0.5 transition-all shadow-inner">
                </div>
                <div>
                    <label class="text-[11px] text-green-300 font-bold tracking-wide uppercase mb-1 block">Email Address</label>
                    <input type="email" id="reg-email" placeholder="name@example.com" class="w-full bg-black/50 border border-white/15 rounded-2xl px-4 py-3 text-xs text-white outline-none focus:border-green-400 focus:ring-2 focus:ring-green-400/30 focus:-translate-y-0.5 transition-all shadow-inner">
                </div>
                <div>
                    <label class="text-[11px] text-green-300 font-bold tracking-wide uppercase mb-1 block">Password</label>
                    <div class="relative">
                        <input type="password" id="reg-password" placeholder="Create secure password" oninput="checkPasswordStrength(this.value)" class="w-full bg-black/50 border border-white/15 rounded-2xl px-4 py-3 pr-10 text-xs text-white outline-none focus:border-green-400 focus:ring-2 focus:ring-green-400/30 focus:-translate-y-0.5 transition-all shadow-inner">
                        <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-white text-xs transition-colors">
                            <i id="eye-icon" class="fas fa-eye"></i>
                        </button>
                    </div>
                    <!-- Password Strength Meter -->
                    <div class="grid grid-cols-4 gap-1.5 mt-2.5">
                        <div id="str-1" class="h-1 bg-white/10 rounded-full transition-all duration-300"></div>
                        <div id="str-2" class="h-1 bg-white/10 rounded-full transition-all duration-300"></div>
                        <div id="str-3" class="h-1 bg-white/10 rounded-full transition-all duration-300"></div>
                        <div id="str-4" class="h-1 bg-white/10 rounded-full transition-all duration-300"></div>
                    </div>
                    <span id="str-text" class="text-[10px] text-gray-400 mt-1 block font-medium">Password security status</span>
                </div>
                <div>
                    <label class="text-[11px] text-green-300 font-bold tracking-wide uppercase mb-1 block">Referral Code (Optional)</label>
                    <input type="text" id="reg-ref-code" placeholder="ANPXXXXXX" class="w-full bg-black/50 border border-white/15 rounded-2xl px-4 py-3 text-xs text-white uppercase outline-none focus:border-green-400 focus:ring-2 focus:ring-green-400/30 focus:-translate-y-0.5 transition-all shadow-inner font-mono">
                </div>
            </div>

            <button id="reg-btn" onclick="handleRegister()" class="w-full py-4 bg-gradient-to-r from-green-500 via-emerald-600 to-green-600 hover:from-green-600 hover:to-emerald-700 text-white font-black rounded-2xl text-xs shadow-[0_10px_25px_rgba(34,197,94,0.4)] mb-4 transition-all active:scale-95 flex items-center justify-center btn-shimmer animate-form">
                Register Account
            </button>
            <p class="text-center text-xs text-gray-300 animate-form">Already registered? <a href="ANP.HTML" class="text-green-400 font-bold hover:underline">Log In</a></p>
        </div>
    </div>

    <!-- CUSTOM HIGH-GUI ANIMATED MODAL SYSTEM -->
    <div id="anp-custom-modal" class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-gray-900 border border-green-500/40 rounded-[36px] p-7 max-w-sm w-full text-center shadow-2xl animate-modal-pop relative overflow-hidden">
            <div class="absolute -top-12 -right-12 w-32 h-32 bg-green-500/15 rounded-full blur-2xl pointer-events-none"></div>
            
            <div id="modal-icon-container" class="my-3 flex justify-center"></div>
            
            <h3 id="modal-title" class="text-lg font-black text-white mb-1.5 tracking-tight">Notice</h3>
            <p id="modal-text" class="text-xs text-gray-300 mb-6 leading-relaxed px-2">Message goes here.</p>
            
            <div id="modal-buttons"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, sendEmailVerification, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDZb4KcR5Tvw3x_ipR2ocgdUDqh47Arz6M",
            authDomain: "anp-money.firebaseapp.com",
            projectId: "anp-money",
            storageBucket: "anp-money.firebasestorage.app",
            messagingSenderId: "581687927989",
            appId: "1:581687927989:web:41218431483f24a18b0afc"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.showAnpAlert = function(title, message, isSuccess = true) {
            return new Promise((resolve) => {
                const modal = document.getElementById("anp-custom-modal");
                document.getElementById("modal-title").innerText = title;
                document.getElementById("modal-text").innerText = message;

                const iconContainer = document.getElementById("modal-icon-container");

                if (isSuccess) {
                    iconContainer.innerHTML = `
                        <div class="w-20 h-20 bg-green-500/15 border border-green-500/40 rounded-full flex items-center justify-center gpay-circle shadow-[0_0_30px_rgba(34,197,94,0.3)]">
                            <svg class="w-10 h-10 text-green-400" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
                                <path class="gpay-check" stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path>
                            </svg>
                        </div>
                    `;
                } else {
                    iconContainer.innerHTML = `
                        <div class="w-20 h-20 bg-red-500/15 border border-red-500/40 rounded-full flex items-center justify-center gpay-circle shadow-[0_0_30px_rgba(239,68,68,0.3)]">
                            <i class="fas fa-exclamation-triangle text-red-400 text-2xl"></i>
                        </div>
                    `;
                }

                const btnContainer = document.getElementById("modal-buttons");
                btnContainer.innerHTML = `
                    <button id="modal-ok-btn" class="w-full py-3.5 bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-600 hover:to-emerald-700 text-white font-bold rounded-2xl text-xs shadow-lg transition-all active:scale-95">
                        Acknowledge
                    </button>
                `;

                modal.classList.remove("hidden");
                document.getElementById("modal-ok-btn").onclick = () => {
                    modal.classList.add("hidden");
                    resolve(true);
                };
            });
        };

        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const refParam = urlParams.get('ref');
            if (refParam) {
                const refInput = document.getElementById("reg-ref-code");
                if (refInput) {
                    refInput.value = refParam.toUpperCase();
                }
            }
        });

        window.togglePasswordVisibility = function() {
            const pwdInput = document.getElementById("reg-password");
            const eyeIcon = document.getElementById("eye-icon");
            if (pwdInput.type === "password") {
                pwdInput.type = "text";
                eyeIcon.className = "fas fa-eye-slash";
            } else {
                pwdInput.type = "password";
                eyeIcon.className = "fas fa-eye";
            }
        }

        window.checkPasswordStrength = function(val) {
            let score = 0;
            if (val.length >= 6) score++;
            if (/[A-Z]/.test(val)) score++;
            if (/[0-9]/.test(val)) score++;
            if (/[^A-Za-z0-9]/.test(val)) score++;

            const bars = [1, 2, 3, 4].map(i => document.getElementById(`str-${i}`));
            const textEl = document.getElementById("str-text");
            
            bars.forEach((bar, idx) => {
                if (idx < score) {
                    bar.className = "h-1 bg-green-400 rounded-full transition-all duration-300 shadow-[0_0_10px_rgba(34,197,94,0.5)]";
                } else {
                    bar.className = "h-1 bg-white/10 rounded-full transition-all duration-300";
                }
            });

            const labels = ["Weak", "Fair", "Good", "Strong Enterprise Grade"];
            textEl.innerText = val.length === 0 ? "Password security status" : labels[score - 1] || "Weak";
        }

        function getLocalDateStr() {
            const date = new Date();
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        window.handleRegister = async function() {
            const name = document.getElementById("reg-name").value.trim();
            const email = document.getElementById("reg-email").value.trim();
            const password = document.getElementById("reg-password").value.trim();
            const refCode = document.getElementById("reg-ref-code").value.trim().toUpperCase();
            const regBtn = document.getElementById("reg-btn");

            if (!name || !email || !password) {
                await showAnpAlert("Input Required", "Please fill in all required fields.", false);
                return;
            }

            regBtn.disabled = true;
            regBtn.innerHTML = `<i class="fas fa-spinner fa-spin mr-2"></i> Initializing Account...`;

            try {
                const creds = await createUserWithEmailAndPassword(auth, email, password);
                const user = creds.user;
                await updateProfile(user, { displayName: name });

                await sendEmailVerification(user);

                const uniqueRefCode = "ANP" + user.uid.substring(0, 6).toUpperCase();
                await setDoc(doc(db, "users", user.uid), {
                    fullName: name,
                    email: email,
                    balance: 0,
                    partnerLevel: "VIP1",
                    todayEarnings: 0,
                    referralRebate: 0,
                    deliveryRebate: 0,
                    totalRevenue: 0,
                    referralCode: uniqueRefCode,
                    referredBy: refCode || "",
                    lastEarnedDate: getLocalDateStr(),
                    startDate: new Date().toLocaleDateString('en-IN')
                });

                await signOut(auth);

                await showAnpAlert("Registration Successful", "A verification link has been sent to your email. Please verify your email before logging in.", true);
                window.location.href = "ANP.HTML"; 
            } catch (e) {
                let friendlyMessage = e.message;
                if (e.code === 'auth/email-already-in-use') {
                    friendlyMessage = "This email is already registered! Please log in instead.";
                } else if (e.code === 'auth/invalid-email') {
                    friendlyMessage = "Please enter a valid email address.";
                } else if (e.code === 'auth/weak-password') {
                    friendlyMessage = "Password should be at least 6 characters long.";
                }

                await showAnpAlert("Registration Error", friendlyMessage, false);
                regBtn.disabled = false;
                regBtn.innerHTML = "Register Account";
            }
        }
    </script>
</body>
</html>
