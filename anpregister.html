<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ANP MONEY - Register</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a1f12 0%, #000000 100%);
            -webkit-tap-highlight-color: transparent;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }
        body::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(circle at 20% 20%, rgba(45,164,90,0.15), transparent 40%), 
                        radial-gradient(circle at 80% 80%, rgba(0,255,150,0.08), transparent 45%);
        }
        .glass-card {
            background: rgba(15, 30, 20, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 25px 50px rgba(0,0,0,0.7);
        }
        @keyframes scaleUpModal {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-modal-pop {
            animation: scaleUpModal 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .app-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="glass-card rounded-[32px] p-8 text-white shadow-2xl animate-modal-pop relative overflow-hidden">
            <!-- Ambient Card Orb -->
            <div class="absolute -top-12 -right-12 w-32 h-32 bg-green-500/20 rounded-full blur-2xl pointer-events-none"></div>

            <div class="text-center mb-6 relative z-10">
                <div class="w-14 h-14 bg-gradient-to-br from-green-400 to-emerald-600 rounded-2xl flex items-center justify-center mx-auto mb-3 text-white text-xl shadow-[0_10px_25px_rgba(34,197,94,0.4)]">
                    <i class="fas fa-user-plus"></i>
                </div>
                <h2 class="text-2xl font-black tracking-tight text-white">Partner Registration</h2>
                <p class="text-xs text-gray-300 mt-1">Create your ANP Green Ride account</p>
            </div>

            <div class="flex flex-col gap-3.5 mb-5 relative z-10">
                <div>
                    <label class="text-[11px] text-green-300 font-semibold mb-1 block">Full Name</label>
                    <input type="text" id="reg-name" placeholder="Enter full name" class="w-full bg-black/40 border border-white/15 rounded-2xl px-4 py-3 text-xs text-white outline-none focus:border-green-400 focus:ring-2 focus:ring-green-400/20 transition-all">
                </div>
                <div>
                    <label class="text-[11px] text-green-300 font-semibold mb-1 block">Email Address</label>
                    <input type="email" id="reg-email" placeholder="Enter email" class="w-full bg-black/40 border border-white/15 rounded-2xl px-4 py-3 text-xs text-white outline-none focus:border-green-400 focus:ring-2 focus:ring-green-400/20 transition-all">
                </div>
                <div>
                    <label class="text-[11px] text-green-300 font-semibold mb-1 block">Password</label>
                    <div class="relative">
                        <input type="password" id="reg-password" placeholder="Create password" class="w-full bg-black/40 border border-white/15 rounded-2xl px-4 py-3 pr-10 text-xs text-white outline-none focus:border-green-400 focus:ring-2 focus:ring-green-400/20 transition-all">
                        <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-white text-xs">
                            <i id="eye-icon" class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                <div>
                    <label class="text-[11px] text-green-300 font-semibold mb-1 block">Referral Code (Optional)</label>
                    <input type="text" id="reg-ref-code" placeholder="Enter friend's referral code" class="w-full bg-black/40 border border-white/15 rounded-2xl px-4 py-3 text-xs text-white uppercase outline-none focus:border-green-400 focus:ring-2 focus:ring-green-400/20 transition-all">
                </div>
            </div>

            <button id="reg-btn" onclick="handleRegister()" class="w-full py-3.5 bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-600 hover:to-emerald-700 text-white font-bold rounded-2xl text-xs shadow-[0_8px_20px_rgba(34,197,94,0.3)] mb-4 transition-all active:scale-95 flex items-center justify-center relative z-10">
                Register Account
            </button>
            <p class="text-center text-xs text-gray-300 relative z-10">Already registered? <a href="ANP.HTML" class="text-green-400 font-bold hover:underline">Log In</a></p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, sendEmailVerification, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDZb4KcR5Tvw3x_ipR2ocgdUDqh47Arz6M",
            authDomain: "anp-money.firebaseapp.com",
            projectId: "anp-money",
            storageBucket: "anp-money.firebasestorage.app",
            messagingSenderId: "581687927989",
            appId: "1:581687927989:web:41218431483f24a18b0afc"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const refParam = urlParams.get('ref');
            if (refParam) {
                const refInput = document.getElementById("reg-ref-code");
                if (refInput) {
                    refInput.value = refParam.toUpperCase();
                }
            }
        });

        window.togglePasswordVisibility = function() {
            const pwdInput = document.getElementById("reg-password");
            const eyeIcon = document.getElementById("eye-icon");
            if (pwdInput.type === "password") {
                pwdInput.type = "text";
                eyeIcon.className = "fas fa-eye-slash";
            } else {
                pwdInput.type = "password";
                eyeIcon.className = "fas fa-eye";
            }
        }

        function getLocalDateStr() {
            const date = new Date();
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        window.handleRegister = async function() {
            const name = document.getElementById("reg-name").value.trim();
            const email = document.getElementById("reg-email").value.trim();
            const password = document.getElementById("reg-password").value.trim();
            const refCode = document.getElementById("reg-ref-code").value.trim().toUpperCase();
            const regBtn = document.getElementById("reg-btn");

            if (!name || !email || !password) {
                alert("Please fill in all required fields.");
                return;
            }

            regBtn.disabled = true;
            regBtn.innerHTML = `<i class="fas fa-spinner fa-spin mr-2"></i> Creating Account...`;

            try {
                const creds = await createUserWithEmailAndPassword(auth, email, password);
                const user = creds.user;
                await updateProfile(user, { displayName: name });

                await sendEmailVerification(user);

                const uniqueRefCode = "ANP" + user.uid.substring(0, 6).toUpperCase();
                await setDoc(doc(db, "users", user.uid), {
                    fullName: name,
                    email: email,
                    balance: 0,
                    partnerLevel: "VIP1",
                    todayEarnings: 0,
                    referralRebate: 0,
                    deliveryRebate: 0,
                    totalRevenue: 0,
                    referralCode: uniqueRefCode,
                    referredBy: refCode || "",
                    lastEarnedDate: getLocalDateStr(),
                    startDate: new Date().toLocaleDateString('en-IN')
                });

                await signOut(auth);

                alert("Registration successful! A verification link has been sent to your email. Please verify your email before logging in.");
                window.location.href = "ANP.HTML"; 
            } catch (e) {
                let friendlyMessage = e.message;
                if (e.code === 'auth/email-already-in-use') {
                    friendlyMessage = "This email is already registered! Please log in instead.";
                } else if (e.code === 'auth/invalid-email') {
                    friendlyMessage = "Please enter a valid email address.";
                } else if (e.code === 'auth/weak-password') {
                    friendlyMessage = "Password should be at least 6 characters long.";
                }

                alert("Registration Error: " + friendlyMessage);
                regBtn.disabled = false;
                regBtn.innerHTML = "Register Account";
            }
        }
    </script>
</body>
</html>
