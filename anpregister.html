<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ANP - Register</title>
<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}
html {
    width: 100%;
    min-height: 100%;
}
body {
    width: 100%;
    min-height: 100dvh;
    font-family: Arial, Helvetica, sans-serif;
    background: #000;
    overflow-x: hidden;
}
.page {
    position: relative;
    width: 100%;
    min-height: 100dvh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    background: linear-gradient(180deg, rgba(0, 0, 0, .4), rgba(0, 0, 0, .6)), url('WhatsApp Image 2026-10-01 at 6.31.01 AM.jpeg') no-repeat center center / cover;
}
.road {
    position: absolute;
    width: 160%;
    height: 50%;
    left: -30%;
    bottom: -10%;
    transform: rotate(-3deg);
    background: linear-gradient(165deg, transparent 30%, rgba(0,0,0,.16) 31%, rgba(0,0,0,.16) 65%, transparent 66%);
    opacity: .7;
    pointer-events: none;
}
.content {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 650px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}
.brand {
    width: 100%;
    text-align: center;
    color: white;
    font-size: clamp(40px, 8vw, 80px);
    line-height: .9;
    font-weight: 900;
    letter-spacing: clamp(-3px, -0.5vw, -6px);
    margin-bottom: clamp(15px, 3vh, 30px);
    text-shadow: 0 4px 8px rgba(0,0,0,.25);
}
.form-title {
    color: white;
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 20px;
    text-align: center;
    letter-spacing: 1px;
}
.login-card {
    width: min(100%, 520px);
    padding: clamp(20px, 4vw, 38px);
    border-radius: clamp(15px, 2.5vw, 28px);
    background: rgba(20, 40, 25, 0.55);
    border: 1px solid rgba(255,255,255,.20);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 20px 60px rgba(0,0,0,.25);
}
.input-box {
    width: 100%;
    min-height: clamp(48px, 6vw, 56px);
    margin-bottom: clamp(12px, 2vw, 18px);
    display: flex;
    align-items: center;
    padding: 0 clamp(12px, 2vw, 18px);
    background: rgba(255,255,255,.95);
    border-radius: clamp(8px, 1.5vw, 13px);
    box-shadow: 0 4px 15px rgba(0,0,0,.08);
}
.icon {
    flex: 0 0 28px;
    width: 28px;
    font-size: clamp(16px, 2vw, 20px);
    text-align: center;
    color: #43805b;
}
.input-box input {
    width: 100%;
    border: none;
    outline: none;
    background: transparent;
    color: #333;
    font-size: clamp(13px, 1.5vw, 17px);
    padding-left: 10px;
}
.eye {
    cursor: pointer;
    color: #777;
    font-size: clamp(15px, 2vw, 19px);
    padding: 5px;
}
.option {
    width: 100%;
    display: flex;
    align-items: flex-start;
    color: rgba(255,255,255,.95);
    font-size: clamp(11px, 1.5vw, 15px);
    margin: clamp(10px, 1.7vw, 17px) 0;
}
.option input {
    appearance: none;
    width: 18px;
    height: 18px;
    margin-right: 9px;
    border: 2px solid rgba(255,255,255,.55);
    border-radius: 50%;
    cursor: pointer;
}
.option input:checked {
    background: #24a95c;
    border-color: white;
    box-shadow: inset 0 0 0 4px white;
}
.btn {
    width: 100%;
    min-height: clamp(48px, 6vw, 56px);
    border: none;
    border-radius: clamp(24px, 4vw, 32px);
    background: linear-gradient(180deg, #2da45a, #299653);
    color: white;
    font-size: clamp(14px, 1.8vw, 18px);
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(0,0,0,.10);
    margin-top: 10px;
}
.btn:hover {
    background: linear-gradient(180deg, #35ad62, #238c4c);
}
.divider {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 15px;
    margin: 20px 0;
    color: white;
    font-size: 14px;
}
.divider span {
    flex: 1;
    height: 1px;
    background: rgba(255,255,255,.35);
}
.login-btn {
    background: transparent;
    border: 2px solid rgba(255, 255, 255, 0.5);
    margin-top: 0;
}
</style>
</head>

<body>
<div class="page">
    <div class="road"></div>
    <main class="content">
        <div class="brand">ANP</div>
        <div class="login-card">
            <div class="form-title">Create an Account</div>

            <div class="input-box">
                <div class="icon">👤</div>
                <input type="text" id="fullname" placeholder="Full Name" autocomplete="off">
            </div>

            <div class="input-box">
                <div class="icon">✉️</div>
                <input type="email" id="email" inputmode="email" placeholder="Email Address" autocomplete="off">
            </div>

            <div class="input-box">
                <div class="icon">📱</div>
                <input type="tel" id="phone" inputmode="tel" placeholder="Phone Number" autocomplete="off">
            </div>

            <div class="input-box">
                <div class="icon">🔒</div>
                <input id="password" type="password" placeholder="Create Password" autocomplete="off">
                <div class="eye" onclick="togglePassword('password')">👁</div>
            </div>

            <div class="input-box">
                <div class="icon">🔒</div>
                <input id="confirm-password" type="password" placeholder="Confirm Password" autocomplete="off">
                <div class="eye" onclick="togglePassword('confirm-password')">👁</div>
            </div>

            <label class="option">
                <input type="checkbox" id="terms">
                <span>I agree to the Terms of Service & Privacy Policy</span>
            </label>

            <button class="btn" type="button" id="register-btn">
                Register Now
            </button>

            <div class="divider">
                <span></span>
                <div>Already have an account?</div>
                <span></span>
            </div>

            <button class="btn login-btn" type="button" onclick="window.location.href='ANP.HTML'">
                Log In
            </button>
        </div>
    </main>
</div>

<script>
    function togglePassword(fieldId) {
        const pwdInput = document.getElementById(fieldId);
        pwdInput.type = pwdInput.type === "password" ? "text" : "password";
    }
</script>

</body>
</html>
