<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ANP MONEY - Live Support Chat</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a1f12 0%, #000000 100%);
            -webkit-tap-highlight-color: transparent;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .bg-wave-pattern {
            background: linear-gradient(to bottom, #5cb45c, #3f8e43);
        }

        .app-container {
            width: 100%;
            max-width: 430px;
            height: 100dvh;
            background: #f8fafc;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }
        @media (min-width: 640px) {
            .app-container {
                height: 880px;
                max-height: 92vh;
                border-radius: 36px;
                border: 8px solid rgba(255, 255, 255, 0.12);
            }
        }

        /* High-Budget Message Entrance Animation */
        @keyframes messageSlideUp {
            0% { opacity: 0; transform: translateY(20px) scale(0.92); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .animate-msg {
            animation: messageSlideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Pulsing Glow Animation for Agent Avatar */
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); }
            50% { box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); }
        }
        .agent-glow {
            animation: pulseGlow 2s infinite ease-in-out;
        }

        /* Typing Indicator Bounce */
        @keyframes bounceDot {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-6px); }
        }
        .typing-dot-1 { animation: bounceDot 1.4s infinite ease-in-out; }
        .typing-dot-2 { animation: bounceDot 1.4s infinite ease-in-out 0.2s; }
        .typing-dot-3 { animation: bounceDot 1.4s infinite ease-in-out 0.4s; }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- Chat Header -->
        <header class="bg-wave-pattern pt-5 px-5 pb-4 text-white flex items-center justify-between shadow-md z-20 flex-shrink-0">
            <div class="flex items-center gap-3">
                <div class="relative">
                    <div class="w-10 h-10 rounded-full bg-white/25 flex items-center justify-center text-white text-base shadow-sm backdrop-blur-md agent-glow">
                        <i class="fas fa-headset"></i>
                    </div>
                    <!-- Online Pulse Dot -->
                    <span class="absolute bottom-0 right-0 w-3 h-3 bg-green-400 border-2 border-green-700 rounded-full animate-pulse"></span>
                </div>
                <div>
                    <h1 class="text-sm font-black tracking-tight">ANP Customer Support</h1>
                    <span class="text-[10px] text-green-100 flex items-center gap-1">
                        <span class="w-1.5 h-1.5 bg-green-300 rounded-full"></span> Online & Active
                    </span>
                </div>
            </div>
            <button onclick="window.location.href='index.html'" class="w-8 h-8 rounded-full bg-white/25 flex items-center justify-center text-white text-xs hover:bg-white/35 transition-all backdrop-blur-md active:scale-95">
                <i class="fas fa-home"></i>
            </button>
        </header>

        <!-- Chat Messages Area (With bottom padding so messages are never hidden behind input) -->
        <main id="chat-messages" class="flex-1 overflow-y-auto p-4 flex flex-col gap-3.5 bg-slate-50/80 hide-scrollbar pb-[145px]">
            
            <!-- Timestamp -->
            <div class="text-center my-1">
                <span class="text-[9px] text-gray-400 bg-gray-200/60 px-3 py-1 rounded-full font-medium shadow-sm">Today, Live Support Active</span>
            </div>

            <!-- Agent Welcome Message -->
            <div class="flex items-start gap-2.5 max-w-[85%] animate-msg">
                <div class="w-8 h-8 rounded-full bg-gradient-to-br from-green-500 to-emerald-600 text-white flex items-center justify-center text-xs shadow-md flex-shrink-0">
                    <i class="fas fa-robot"></i>
                </div>
                <div class="bg-white border border-gray-100 rounded-2xl rounded-tl-sm p-3.5 text-gray-800 shadow-sm text-xs leading-relaxed">
                    <p class="font-bold text-green-700 mb-0.5 flex items-center gap-1">
                        ANP Support Agent <i class="fas fa-check-circle text-[10px] text-sky-500"></i>
                    </p>
                    Hello Partner! 👋 Welcome to ANP Green Ride live support. How can we help you today with your VIP packs, deposits, or withdrawals?
                    <span class="text-[9px] text-gray-400 block mt-1 text-right">Just now</span>
                </div>
            </div>

        </main>

        <!-- Fixed Bottom Input Bar (Positioned cleanly right above bottom navigation bar) -->
        <div class="absolute bottom-[65px] left-0 w-full bg-white/95 backdrop-blur-md border-t border-gray-200/80 px-4 py-3 z-30 shadow-[0_-5px_20px_rgba(0,0,0,0.06)]">
            <!-- Typing Indicator -->
            <div id="typing-indicator" class="hidden pb-2 flex items-center gap-2 animate-msg">
                <div class="w-6 h-6 rounded-full bg-green-600 text-white flex items-center justify-center text-[10px] shadow-sm">
                    <i class="fas fa-robot"></i>
                </div>
                <div class="bg-white border border-gray-100 rounded-2xl px-3 py-1.5 shadow-sm flex items-center gap-1.5">
                    <div class="w-1.5 h-1.5 bg-green-500 rounded-full typing-dot-1"></div>
                    <div class="w-1.5 h-1.5 bg-green-500 rounded-full typing-dot-2"></div>
                    <div class="w-1.5 h-1.5 bg-green-500 rounded-full typing-dot-3"></div>
                </div>
            </div>

            <!-- Input Bar -->
            <div class="flex items-center gap-2.5">
                <input type="text" id="chat-input" onkeypress="handleKeyPress(event)" placeholder="Type your message here..." class="flex-1 bg-gray-100 border border-gray-200 rounded-2xl px-4 py-3 text-xs text-gray-800 outline-none focus:border-green-500 focus:bg-white focus:ring-2 focus:ring-green-400/20 transition-all shadow-inner">
                <button onclick="sendMessage()" class="w-11 h-11 bg-gradient-to-br from-green-500 to-emerald-600 hover:from-green-600 hover:to-emerald-700 text-white rounded-2xl flex items-center justify-center shadow-lg transition-all active:scale-95 flex-shrink-0">
                    <i class="fas fa-paper-plane text-xs"></i>
                </button>
            </div>
        </div>

        <!-- Bottom Navigation Bar (Map Tab linked to map.html) -->
        <nav class="absolute bottom-0 w-full bg-white border-t border-gray-100 flex justify-between items-center px-6 pt-2 pb-5 z-40 shadow-2xl">
            <button onclick="window.location.href='index.html'" class="flex flex-col items-center text-gray-400 group hover:text-green-600 transition-colors">
                <i class="fas fa-home text-lg mb-1"></i>
                <span class="text-[10px] font-medium">Home</span>
            </button>
            <button onclick="window.location.href='delivery.html'" class="flex flex-col items-center text-gray-400 group hover:text-green-600 transition-colors">
                <i class="fas fa-box text-lg mb-1"></i>
                <span class="text-[10px] font-medium">Delivery</span>
            </button>
            <div class="relative -top-6">
                <button onclick="window.location.href='index.html'" class="w-14 h-14 bg-gradient-to-br from-green-400 to-green-600 rounded-full flex items-center justify-center text-white border-4 border-white shadow-[0_5px_15px_rgba(74,222,128,0.4)] active:scale-95 transition-transform">
                    <i class="fas fa-bicycle text-2xl"></i>
                </button>
            </div>
            <!-- Map tab linked to map.html -->
            <button onclick="window.location.href='map.html'" class="flex flex-col items-center text-green-600 group">
                <i class="fas fa-map-marked-alt text-lg mb-1"></i>
                <span class="text-[10px] font-medium">Map</span>
            </button>
            <button onclick="window.location.href='my.html'" class="flex flex-col items-center text-gray-400 group hover:text-green-600 transition-colors">
                <i class="fas fa-user text-lg mb-1"></i>
                <span class="text-[10px] font-medium">My</span>
            </button>
        </nav>
    </div>

    <script>
        const chatMessages = document.getElementById("chat-messages");
        const chatInput = document.getElementById("chat-input");
        const typingIndicator = document.getElementById("typing-indicator");

        function getCurrentTime() {
            const now = new Date();
            return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }

        function scrollToBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function sendMessage() {
            const text = chatInput.value.trim();
            if (!text) return;

            // 1. Append User Message with animation
            const userMsgHTML = `
                <div class="flex items-end justify-end gap-2.5 max-w-[85%] ml-auto animate-msg">
                    <div class="bg-gradient-to-r from-green-600 to-emerald-600 text-white rounded-2xl rounded-tr-sm p-3.5 shadow-md text-xs leading-relaxed">
                        ${escapeHtml(text)}
                        <span class="text-[9px] text-green-200 block mt-1 text-right">${getCurrentTime()}</span>
                    </div>
                    <div class="w-8 h-8 rounded-full bg-gray-800 text-white flex items-center justify-center text-xs shadow-md flex-shrink-0">
                        <i class="fas fa-user"></i>
                    </div>
                </div>
            `;
            chatMessages.insertAdjacentHTML('beforeend', userMsgHTML);
            chatInput.value = "";
            scrollToBottom();

            // 2. Show Typing Indicator after 500ms
            setTimeout(() => {
                typingIndicator.classList.remove("hidden");
                scrollToBottom();
            }, 500);

            // 3. Simulate Smart Agent Reply after 2 seconds with smooth entrance animation
            setTimeout(() => {
                typingIndicator.classList.add("hidden");
                
                let replyText = "Thank you for reaching out! Our support team has received your query and will resolve it shortly.";
                const lower = text.toLowerCase();
                
                if (lower.includes('deposit') || lower.includes('utr') || lower.includes('recharge')) {
                    replyText = "For deposit verification, please ensure you have submitted your correct 12-digit UTR number. Deposits are verified by our admin team within 5-10 minutes!";
                } else if (lower.includes('withdraw') || lower.includes('money') || lower.includes('bank')) {
                    replyText = "Withdrawals are processed securely up to ₹200 per request (max 3 times a day). Please make sure your bank account and IFSC code are correct.";
                } else if (lower.includes('earn') || lower.includes('vip') || lower.includes('monday') || lower.includes('tuesday')) {
                    replyText = "Remember that daily earnings run every day except Mondays and Tuesdays! Your earnings catch up automatically when you open your dashboard.";
                }

                const agentMsgHTML = `
                    <div class="flex items-start gap-2.5 max-w-[85%] animate-msg">
                        <div class="w-8 h-8 rounded-full bg-gradient-to-br from-green-500 to-emerald-600 text-white flex items-center justify-center text-xs shadow-md flex-shrink-0">
                            <i class="fas fa-robot"></i>
                        </div>
                        <div class="bg-white border border-gray-100 rounded-2xl rounded-tl-sm p-3.5 text-gray-800 shadow-sm text-xs leading-relaxed">
                            <p class="font-bold text-green-700 mb-0.5 flex items-center gap-1">
                                ANP Support Agent <i class="fas fa-check-circle text-[10px] text-sky-500"></i>
                            </p>
                            ${replyText}
                            <span class="text-[9px] text-gray-400 block mt-1 text-right">${getCurrentTime()}</span>
                        </div>
                    </div>
                `;
                chatMessages.insertAdjacentHTML('beforeend', agentMsgHTML);
                scrollToBottom();
            }, 2200);
        }

        function escapeHtml(string) {
            return string.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
