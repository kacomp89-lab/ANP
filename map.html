<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ANP MONEY - Live Support Chat</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a1f12 0%, #000000 100%);
            -webkit-tap-highlight-color: transparent;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .bg-wave-pattern {
            background: linear-gradient(to bottom, #5cb45c, #3f8e43);
        }

        .app-container {
            width: 100%;
            max-width: 430px;
            height: 100dvh;
            background: #f8fafc;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }
        @media (min-width: 640px) {
            .app-container {
                height: 880px;
                max-height: 92vh;
                border-radius: 36px;
                border: 8px solid rgba(255, 255, 255, 0.12);
            }
        }

        @keyframes messageSlideUp {
            0% { opacity: 0; transform: translateY(20px) scale(0.92); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .animate-msg {
            animation: messageSlideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); }
            50% { box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); }
        }
        .agent-glow { animation: pulseGlow 2s infinite ease-in-out; }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- Chat Header -->
        <header class="bg-wave-pattern pt-5 px-5 pb-4 text-white flex items-center justify-between shadow-md z-20 flex-shrink-0">
            <div class="flex items-center gap-3">
                <div class="relative">
                    <div class="w-10 h-10 rounded-full bg-white/25 flex items-center justify-center text-white text-base shadow-sm backdrop-blur-md agent-glow">
                        <i class="fas fa-headset"></i>
                    </div>
                    <span class="absolute bottom-0 right-0 w-3 h-3 bg-green-400 border-2 border-green-700 rounded-full animate-pulse"></span>
                </div>
                <div>
                    <h1 class="text-sm font-black tracking-tight">ANP Customer Support</h1>
                    <span class="text-[10px] text-green-100 flex items-center gap-1">
                        <span class="w-1.5 h-1.5 bg-green-300 rounded-full"></span> Online & Active
                    </span>
                </div>
            </div>
            <button onclick="window.location.href='index.html'" class="w-8 h-8 rounded-full bg-white/25 flex items-center justify-center text-white text-xs hover:bg-white/35 transition-all backdrop-blur-md active:scale-95">
                <i class="fas fa-home"></i>
            </button>
        </header>

        <!-- Chat Messages Area -->
        <main id="chat-messages" class="flex-1 overflow-y-auto p-4 flex flex-col gap-3.5 bg-slate-50/80 hide-scrollbar">
            <div class="text-center my-1">
                <span class="text-[9px] text-gray-400 bg-gray-200/60 px-3 py-1 rounded-full font-medium shadow-sm">Today, Live Support Active</span>
            </div>

            <!-- Welcome Message -->
            <div class="flex items-start gap-2.5 max-w-[85%] animate-msg">
                <div class="w-8 h-8 rounded-full bg-gradient-to-br from-green-500 to-emerald-600 text-white flex items-center justify-center text-xs shadow-md flex-shrink-0">
                    <i class="fas fa-robot"></i>
                </div>
                <div class="bg-white border border-gray-100 rounded-2xl rounded-tl-sm p-3.5 text-gray-800 shadow-sm text-xs leading-relaxed">
                    <p class="font-bold text-green-700 mb-0.5 flex items-center gap-1">
                        ANP Support Agent <i class="fas fa-check-circle text-[10px] text-sky-500"></i>
                    </p>
                    Hello Partner! 👋 Send your message here, and our live admin team will receive it instantly.
                </div>
            </div>
        </main>

        <!-- Chat Input Bar -->
        <div class="bg-white border-t border-gray-200/80 px-4 py-3 flex-shrink-0 shadow-[0_-4px_15px_rgba(0,0,0,0.05)]">
            <div class="flex items-center gap-2.5">
                <input type="text" id="chat-input" onkeypress="handleKeyPress(event)" placeholder="Type your message to admin..." class="flex-1 bg-gray-100 border border-gray-200 rounded-2xl px-4 py-3 text-xs text-gray-800 outline-none focus:border-green-500 focus:bg-white focus:ring-2 focus:ring-green-400/20 transition-all shadow-inner">
                <button onclick="sendMessage()" class="w-11 h-11 bg-gradient-to-br from-green-500 to-emerald-600 hover:from-green-600 hover:to-emerald-700 text-white rounded-2xl flex items-center justify-center shadow-lg transition-all active:scale-95 flex-shrink-0">
                    <i class="fas fa-paper-plane text-xs"></i>
                </button>
            </div>
        </div>

        <!-- Bottom Navigation Bar -->
        <nav class="w-full bg-white border-t border-gray-100 flex justify-between items-center px-6 pt-2 pb-5 flex-shrink-0 shadow-2xl z-40">
            <button onclick="window.location.href='index.html'" class="flex flex-col items-center text-gray-400 group hover:text-green-600 transition-colors">
                <i class="fas fa-home text-lg mb-1"></i>
                <span class="text-[10px] font-medium">Home</span>
            </button>
            <button onclick="window.location.href='delivery.html'" class="flex flex-col items-center text-gray-400 group hover:text-green-600 transition-colors">
                <i class="fas fa-box text-lg mb-1"></i>
                <span class="text-[10px] font-medium">Delivery</span>
            </button>
            <div class="relative -top-6">
                <button onclick="window.location.href='index.html'" class="w-14 h-14 bg-gradient-to-br from-green-400 to-green-600 rounded-full flex items-center justify-center text-white border-4 border-white shadow-[0_5px_15px_rgba(74,222,128,0.4)] active:scale-95 transition-transform">
                    <i class="fas fa-bicycle text-2xl"></i>
                </button>
            </div>
            <button onclick="window.location.href='map.html'" class="flex flex-col items-center text-green-600 group">
                <i class="fas fa-map-marked-alt text-lg mb-1"></i>
                <span class="text-[10px] font-medium">Map</span>
            </button>
            <button onclick="window.location.href='my.html'" class="flex flex-col items-center text-gray-400 group hover:text-green-600 transition-colors">
                <i class="fas fa-user text-lg mb-1"></i>
                <span class="text-[10px] font-medium">My</span>
            </button>
        </nav>
    </div>

    <!-- Firebase Script Integration -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDZb4KcR5Tvw3x_ipR2ocgdUDqh47Arz6M",
            authDomain: "anp-money.firebaseapp.com",
            projectId: "anp-money",
            storageBucket: "anp-money.firebasestorage.app",
            messagingSenderId: "581687927989",
            appId: "1:581687927989:web:41218431483f24a18b0afc"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        const chatMessages = document.getElementById("chat-messages");

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                alert("Please log in to use live support chat.");
                window.location.href = "ANP.HTML";
                return;
            }
            currentUser = user;
            loadUserMessages(user.uid);
        });

        function loadUserMessages(uid) {
            // Query without orderBy to avoid needing Firestore compound indexes
            const q = query(collection(db, "support_chats"), where("uid", "==", uid));
            
            onSnapshot(q, (snapshot) => {
                // Reset chat container with static header & welcome message
                chatMessages.innerHTML = `
                    <div class="text-center my-1">
                        <span class="text-[9px] text-gray-400 bg-gray-200/60 px-3 py-1 rounded-full font-medium shadow-sm">Today, Live Support Active</span>
                    </div>
                    <div class="flex items-start gap-2.5 max-w-[85%] animate-msg">
                        <div class="w-8 h-8 rounded-full bg-gradient-to-br from-green-500 to-emerald-600 text-white flex items-center justify-center text-xs shadow-md flex-shrink-0">
                            <i class="fas fa-robot"></i>
                        </div>
                        <div class="bg-white border border-gray-100 rounded-2xl rounded-tl-sm p-3.5 text-gray-800 shadow-sm text-xs leading-relaxed">
                            <p class="font-bold text-green-700 mb-0.5 flex items-center gap-1">
                                ANP Support Agent <i class="fas fa-check-circle text-[10px] text-sky-500"></i>
                            </p>
                            Hello Partner! 👋 Send your message here, and our live admin team will receive it instantly.
                        </div>
                    </div>
                `;

                // Gather docs and sort them locally in JavaScript by creation timestamp
                let messages = [];
                snapshot.forEach((docSnap) => {
                    messages.push(docSnap.data());
                });
                messages.sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));

                // Render sorted messages
                messages.forEach((data) => {
                    const timeStr = new Date(data.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                    if (data.sender === 'user') {
                        const userMsgHTML = `
                            <div class="flex items-end justify-end gap-2.5 max-w-[85%] ml-auto animate-msg">
                                <div class="bg-gradient-to-r from-green-600 to-emerald-600 text-white rounded-2xl rounded-tr-sm p-3.5 shadow-md text-xs leading-relaxed">
                                    ${escapeHtml(data.message)}
                                    <span class="text-[9px] text-green-200 block mt-1 text-right">${timeStr}</span>
                                </div>
                                <div class="w-8 h-8 rounded-full bg-gray-800 text-white flex items-center justify-center text-xs shadow-md flex-shrink-0">
                                    <i class="fas fa-user"></i>
                                </div>
                            </div>
                        `;
                        chatMessages.insertAdjacentHTML('beforeend', userMsgHTML);
                    } else {
                        const adminMsgHTML = `
                            <div class="flex items-start gap-2.5 max-w-[85%] animate-msg">
                                <div class="w-8 h-8 rounded-full bg-gradient-to-br from-green-500 to-emerald-600 text-white flex items-center justify-center text-xs shadow-md flex-shrink-0">
                                    <i class="fas fa-user-shield"></i>
                                </div>
                                <div class="bg-white border border-gray-100 rounded-2xl rounded-tl-sm p-3.5 text-gray-800 shadow-sm text-xs leading-relaxed">
                                    <p class="font-bold text-green-700 mb-0.5">ANP Support Admin</p>
                                    ${escapeHtml(data.message)}
                                    <span class="text-[9px] text-gray-400 block mt-1 text-right">${timeStr}</span>
                                </div>
                            </div>
                        `;
                        chatMessages.insertAdjacentHTML('beforeend', adminMsgHTML);
                    }
                });
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }, (error) => {
                console.error("Chat sync error: ", error);
            });
        }

        window.sendMessage = async function() {
            const chatInput = document.getElementById("chat-input");
            const text = chatInput.value.trim();
            if (!text || !currentUser) return;

            try {
                await addDoc(collection(db, "support_chats"), {
                    uid: currentUser.uid,
                    email: currentUser.email,
                    message: text,
                    sender: "user",
                    createdAt: new Date().toISOString()
                });
                chatInput.value = "";
            } catch (e) {
                alert("Error sending message: " + e.message);
            }
        }

        window.handleKeyPress = function(e) {
            if (e.key === 'Enter') {
                window.sendMessage();
            }
        }

        function escapeHtml(string) {
            return string.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
