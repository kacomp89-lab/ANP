<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ANP MONEY - My Profile</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a1f12 0%, #000000 100%);
            -webkit-tap-highlight-color: transparent;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .bg-wave-pattern {
            background: linear-gradient(to bottom, #5cb45c, #3f8e43);
        }
        .app-container {
            width: 100%;
            max-width: 430px;
            height: 100dvh;
            background: white;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }
        @media (min-width: 640px) {
            .app-container {
                height: 880px;
                max-height: 92vh;
                border-radius: 36px;
                border: 8px solid rgba(255, 255, 255, 0.12);
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- Header Profile Summary -->
        <header class="bg-wave-pattern pt-8 px-6 pb-8 text-white relative">
            <div class="flex items-center justify-between mb-4">
                <h1 class="text-lg font-black tracking-tight">My Profile</h1>
                <button onclick="handleLogout()" class="px-3 py-1.5 bg-red-600/80 hover:bg-red-600 text-white rounded-xl text-xs font-bold transition-all shadow">
                    <i class="fas fa-sign-out-alt mr-1"></i> Log Out
                </button>
            </div>
            
            <div class="flex items-center gap-4 mt-4">
                <div class="w-14 h-14 bg-white text-green-700 rounded-full flex items-center justify-center text-2xl font-black shadow-md" id="profile-initial">
                    A
                </div>
                <div>
                    <h2 class="text-base font-bold" id="profile-name">Loading...</h2>
                    <p class="text-xs text-green-100" id="profile-email">--</p>
                    <span class="inline-block mt-1 bg-green-700/60 text-green-100 text-[10px] font-extrabold px-2.5 py-0.5 rounded-full" id="profile-level">VIP1</span>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-1 bg-white rounded-t-[24px] -mt-4 relative z-10 px-5 pt-6 pb-24 overflow-y-auto hide-scrollbar">
            
            <!-- Account Overview Cards -->
            <div class="grid grid-cols-2 gap-3 mb-6">
                <div class="bg-green-50 border border-green-100 rounded-2xl p-4 text-center shadow-sm">
                    <span class="text-[11px] text-gray-500 block mb-1 font-medium">Available Balance</span>
                    <span class="text-lg font-black text-green-800" id="profile-balance">₹0.00</span>
                </div>
                <div class="bg-emerald-50 border border-emerald-100 rounded-2xl p-4 text-center shadow-sm">
                    <span class="text-[11px] text-gray-500 block mb-1 font-medium">Total Revenue</span>
                    <span class="text-lg font-black text-emerald-800" id="profile-revenue">₹0.00</span>
                </div>
            </div>

            <!-- Saved Bank Account Section -->
            <div class="bg-gray-50 border border-gray-100 rounded-2xl p-4 mb-6 shadow-sm">
                <h3 class="text-xs font-bold text-gray-800 mb-3 flex items-center gap-2">
                    <i class="fas fa-university text-green-600"></i> Saved Bank Account Details
                </h3>
                
                <div id="bank-info-box">
                    <p class="text-xs text-gray-400">Loading bank details...</p>
                </div>
            </div>

            <!-- Quick Links / Actions -->
            <div class="flex flex-col gap-2.5">
                <button onclick="window.location.href='delivery.html'" class="w-full py-3 px-4 bg-gray-50 hover:bg-gray-100 text-gray-800 font-semibold rounded-xl text-xs flex justify-between items-center border border-gray-100 transition-all">
                    <span class="flex items-center gap-2"><i class="fas fa-history text-green-600"></i> Transaction History</span>
                    <i class="fas fa-chevron-right text-gray-400"></i>
                </button>
                <button onclick="window.location.href='index.html'" class="w-full py-3 px-4 bg-gray-50 hover:bg-gray-100 text-gray-800 font-semibold rounded-xl text-xs flex justify-between items-center border border-gray-100 transition-all">
                    <span class="flex items-center gap-2"><i class="fas fa-home text-green-600"></i> Back to Home Dashboard</span>
                    <i class="fas fa-chevron-right text-gray-400"></i>
                </button>
            </div>

        </main>

        <!-- Edit Bank Modal with Strict Validation -->
        <div id="edit-bank-modal" class="fixed inset-0 bg-black bg-opacity-80 z-50 flex items-center justify-center hidden px-4 backdrop-blur-md">
            <div class="bg-gray-900 border border-green-900 rounded-3xl max-w-sm w-full p-6 text-center shadow-2xl text-white">
                <h3 class="text-lg font-bold mb-1">Edit Bank Account</h3>
                <p class="text-[11px] text-gray-400 mb-4">Update your valid payout details below:</p>
                
                <div class="flex flex-col gap-3 text-left mb-4">
                    <div>
                        <label class="text-[10px] text-green-300 font-semibold mb-1 block">Bank Account Number (9-18 digits)</label>
                        <input type="text" id="edit-account-num" placeholder="Enter Account Number" class="w-full bg-black/50 border border-green-800 rounded-xl px-3 py-2.5 text-xs text-white outline-none focus:border-green-400">
                    </div>
                    <div>
                        <label class="text-[10px] text-green-300 font-semibold mb-1 block">IFSC Code (e.g. SBIN0001234)</label>
                        <input type="text" id="edit-ifsc" placeholder="Enter IFSC Code" class="w-full bg-black/50 border border-green-800 rounded-xl px-3 py-2.5 text-xs text-white outline-none focus:border-green-400 uppercase">
                    </div>
                </div>

                <div class="flex flex-col gap-2">
                    <button onclick="saveBankDetails()" class="w-full py-3 bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-600 hover:to-emerald-700 text-white font-bold rounded-xl text-xs shadow-lg">
                        Save Changes
                    </button>
                    <button onclick="closeEditBankModal()" class="w-full py-2 bg-transparent hover:bg-white/10 text-gray-400 rounded-xl text-[11px]">
                        Cancel
                    </button>
                </div>
            </div>
        </div>

        <!-- Bottom Navigation Bar -->
        <nav class="absolute bottom-0 w-full bg-white border-t border-gray-100 flex justify-between items-center px-6 pt-2 pb-5 z-40">
            <button onclick="window.location.href='index.html'" class="flex flex-col items-center text-gray-400 group hover:text-green-600">
                <i class="fas fa-home text-lg mb-1"></i>
                <span class="text-[10px] font-medium">Home</span>
            </button>
            <button onclick="window.location.href='delivery.html'" class="flex flex-col items-center text-gray-400 group hover:text-green-600">
                <i class="fas fa-box text-lg mb-1"></i>
                <span class="text-[10px] font-medium">Delivery</span>
            </button>
            <div class="relative -top-6">
                <button onclick="window.location.href='index.html'" class="w-14 h-14 bg-gradient-to-br from-green-400 to-green-600 rounded-full flex items-center justify-center text-white border-4 border-white shadow-[0_5px_15px_rgba(74,222,128,0.4)]">
                    <i class="fas fa-bicycle text-2xl"></i>
                </button>
            </div>
            <button onclick="alert('Map view coming soon!');" class="flex flex-col items-center text-gray-400 group hover:text-green-600">
                <i class="fas fa-map-marked-alt text-lg mb-1"></i>
                <span class="text-[10px] font-medium">Map</span>
            </button>
            <button onclick="window.location.href='my.html'" class="flex flex-col items-center text-green-600 group">
                <i class="fas fa-user text-lg mb-1"></i>
                <span class="text-[10px] font-medium">My</span>
            </button>
        </nav>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDZb4KcR5Tvw3x_ipR2ocgdUDqh47Arz6M",
            authDomain: "anp-money.firebaseapp.com",
            projectId: "anp-money",
            storageBucket: "anp-money.firebasestorage.app",
            messagingSenderId: "581687927989",
            appId: "1:581687927989:web:41218431483f24a18b0afc"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let userDocRef = null;
        let currentUserData = null;

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = 'ANP.HTML';
                return;
            }

            currentUser = user;
            userDocRef = doc(db, "users", user.uid);

            try {
                const snap = await getDoc(userDocRef);
                if (snap.exists()) {
                    currentUserData = snap.data();
                    const name = currentUserData.fullName || "Partner";
                    document.getElementById("profile-name").innerText = name;
                    document.getElementById("profile-initial").innerText = name.charAt(0).toUpperCase();
                    document.getElementById("profile-email").innerText = user.email;
                    document.getElementById("profile-level").innerText = currentUserData.partnerLevel || "VIP1";
                    document.getElementById("profile-balance").innerText = `₹${(currentUserData.balance || 0).toLocaleString()}`;
                    document.getElementById("profile-revenue").innerText = `₹${(currentUserData.totalRevenue || 0).toLocaleString()}`;

                    renderBankDetails();
                }
            } catch (e) {
                console.error("Error loading profile:", e);
            }
        });

        window.renderBankDetails = function() {
            const box = document.getElementById("bank-info-box");
            if (currentUserData && currentUserData.bankAccount) {
                box.innerHTML = `
                    <div class="flex justify-between items-center bg-white border border-gray-100 rounded-xl p-3 shadow-sm">
                        <div>
                            <p class="text-[11px] text-gray-500 font-semibold mb-0.5">Account Number: <span class="text-gray-900 font-mono font-bold">${currentUserData.bankAccount}</span></p>
                            <p class="text-[11px] text-gray-500 font-semibold">IFSC Code: <span class="text-gray-900 font-mono font-bold">${currentUserData.ifsc || 'N/A'}</span></p>
                        </div>
                        <div class="flex gap-1.5">
                            <button onclick="openEditBankModal()" class="px-2.5 py-1 bg-blue-600 text-white rounded-lg text-[10px] font-bold shadow">Edit</button>
                            <button onclick="deleteBankDetails()" class="px-2.5 py-1 bg-red-600 text-white rounded-lg text-[10px] font-bold shadow">Delete</button>
                        </div>
                    </div>
                `;
            } else {
                box.innerHTML = `
                    <div class="text-center py-3">
                        <p class="text-xs text-gray-400 mb-2">No bank account linked yet.</p>
                        <button onclick="openEditBankModal()" class="px-4 py-2 bg-green-600 hover:bg-green-700 text-white rounded-xl text-xs font-bold shadow">
                            <i class="fas fa-plus mr-1"></i> Add Bank Details
                        </button>
                    </div>
                `;
            }
        }

        window.openEditBankModal = function() {
            if (currentUserData) {
                document.getElementById("edit-account-num").value = currentUserData.bankAccount || "";
                document.getElementById("edit-ifsc").value = currentUserData.ifsc || "";
            }
            document.getElementById("edit-bank-modal").classList.remove("hidden");
        }

        window.closeEditBankModal = function() {
            document.getElementById("edit-bank-modal").classList.add("hidden");
        }

        window.saveBankDetails = async function() {
            const accNum = document.getElementById("edit-account-num").value.trim();
            const ifscCode = document.getElementById("edit-ifsc").value.trim().toUpperCase();

            // Strict Validation
            const accountRegex = /^\d{9,18}$/;
            const ifscRegex = /^[A-Z]{4}0[A-Z0-9]{6}$/;

            if (!accountRegex.test(accNum)) {
                alert("Invalid Bank Account Number! Please enter a valid 9 to 18 digit account number.");
                return;
            }
            if (!ifscRegex.test(ifscCode)) {
                alert("Invalid IFSC Code! Format should be 4 letters, '0', and 6 alphanumeric chars (e.g. SBIN0001234).");
                return;
            }

            try {
                await updateDoc(userDocRef, {
                    bankAccount: accNum,
                    ifsc: ifscCode
                });

                currentUserData.bankAccount = accNum;
                currentUserData.ifsc = ifscCode;

                closeEditBankModal();
                renderBankDetails();
                alert("Bank details updated successfully!");
            } catch (e) {
                alert("Error updating bank details: " + e.message);
            }
        }

        window.deleteBankDetails = async function() {
            if (!confirm("Are you sure you want to delete your saved bank account?")) return;

            try {
                await updateDoc(userDocRef, {
                    bankAccount: null,
                    ifsc: null
                });

                currentUserData.bankAccount = null;
                currentUserData.ifsc = null;

                renderBankDetails();
                alert("Bank details deleted successfully.");
            } catch (e) {
                alert("Error deleting bank details: " + e.message);
            }
        }

        window.handleLogout = async function() {
            if (confirm("Are you sure you want to log out?")) {
                await signOut(auth);
                window.location.href = 'index.html';
            }
        }
    </script>
</body>
</html>
