<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ANP MONEY - Secure Login</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: #020b05;
            -webkit-tap-highlight-color: transparent;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient Floating Cyber Orbs */
        .orb-1 {
            position: absolute; top: -10%; left: -10%; width: 350px; height: 350px;
            background: radial-gradient(circle, rgba(16,185,129,0.2) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%; animation: floatOrb 8s infinite alternate ease-in-out; pointer-events: none;
        }
        .orb-2 {
            position: absolute; bottom: -10%; right: -10%; width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(5,150,105,0.15) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%; animation: floatOrb 10s infinite alternate-reverse ease-in-out; pointer-events: none;
        }
        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 40px) scale(1.1); }
        }

        .glass-card {
            background: rgba(10, 24, 15, 0.75);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 30px 60px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.1);
        }

        /* Staggered Entrance Animations */
        @keyframes slideDown {
            0% { opacity: 0; transform: translateY(-20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideUp {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-logo { animation: slideDown 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-form { animation: slideUp 0.6s 0.15s cubic-bezier(0.16, 1, 0.3, 1) both; }

        /* Tactile Button & Ripple Physics */
        .tactile-btn {
            position: relative; overflow: hidden; transform: translateZ(0);
            transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.15s ease, filter 0.15s ease;
            cursor: pointer; -webkit-user-select: none; user-select: none;
        }
        .tactile-btn:hover { filter: brightness(1.08); }
        .tactile-btn:active { transform: scale(0.93) translateY(1px) !important; box-shadow: 0 2px 8px rgba(34, 197, 94, 0.25) !important; }

        .ripple {
            position: absolute; background: radial-gradient(circle, rgba(255, 255, 255, 0.6) 0%, rgba(255, 255, 255, 0) 70%);
            border-radius: 50%; transform: scale(0); animation: rippleEffect 0.55s cubic-bezier(0.4, 0, 0.2, 1) forwards; pointer-events: none;
        }
        @keyframes rippleEffect {
            0% { transform: scale(0); opacity: 0.8; }
            100% { transform: scale(4.5); opacity: 0; }
        }

        /* Shimmer Sheen on Primary Button */
        @keyframes shimmerBtn {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        .btn-shimmer { position: relative; overflow: hidden; }
        .btn-shimmer::after {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transform: translateX(-100%); animation: shimmerBtn 3s infinite;
        }

        /* GPay / Paytm Tick Animation */
        @keyframes circleScale {
            0% { transform: scale(0); opacity: 0; }
            60% { transform: scale(1.12); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes checkmarkDraw {
            0% { stroke-dashoffset: 48; }
            100% { stroke-dashoffset: 0; }
        }
        .gpay-circle { animation: circleScale 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .gpay-check { stroke-dasharray: 48; stroke-dashoffset: 48; animation: checkmarkDraw 0.4s 0.25s ease-in-out forwards; }

        @keyframes scaleUpModal {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-modal-pop { animation: scaleUpModal 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        .app-container { width: 100%; max-width: 420px; padding: 20px; z-index: 10; }
    </style>
</head>
<body>

    <div class="orb-1"></div>
    <div class="orb-2"></div>

    <div class="app-container">
        <div class="glass-card rounded-[36px] p-8 text-white shadow-2xl relative overflow-hidden">
            
            <!-- Logo & Header -->
            <div class="text-center mb-7 animate-logo">
                <div class="w-16 h-16 bg-gradient-to-br from-green-400 to-emerald-600 rounded-2xl flex items-center justify-center mx-auto mb-4 text-white text-2xl shadow-[0_10px_30px_rgba(34,197,94,0.5)] transform hover:scale-105 transition-transform duration-300">
                    <i class="fas fa-bicycle"></i>
                </div>
                <h2 class="text-2xl font-black tracking-tight text-white">Welcome Back</h2>
                <p class="text-xs text-gray-300 mt-1 font-medium">Log in to your ANP Money Dashboard</p>
            </div>

            <!-- Form Container -->
            <div class="flex flex-col gap-4 mb-5 animate-form">
                <div>
                    <label class="text-[11px] text-green-300 font-bold tracking-wide uppercase mb-1.5 block">Email Address</label>
                    <input type="email" id="login-email" placeholder="name@example.com" class="w-full bg-black/50 border border-white/15 rounded-2xl px-4 py-3.5 text-xs text-white outline-none focus:border-green-400 focus:ring-2 focus:ring-green-400/30 focus:-translate-y-0.5 transition-all shadow-inner">
                </div>
                <div>
                    <label class="text-[11px] text-green-300 font-bold tracking-wide uppercase mb-1.5 block">Password</label>
                    <div class="relative">
                        <input type="password" id="login-password" placeholder="••••••••" class="w-full bg-black/50 border border-white/15 rounded-2xl px-4 py-3.5 pr-10 text-xs text-white outline-none focus:border-green-400 focus:ring-2 focus:ring-green-400/30 focus:-translate-y-0.5 transition-all shadow-inner">
                        <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-white text-xs transition-colors">
                            <i id="eye-icon" class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Unverified warning container -->
            <div id="verification-warning-box" class="hidden mb-4 bg-amber-500/15 border border-amber-500/40 rounded-2xl p-4 text-center animate-form">
                <p class="text-[11px] text-amber-300 font-medium mb-2.5 leading-relaxed">Your email is not verified yet! Please check your inbox or spam folder.</p>
                <button onclick="resendVerificationEmail()" class="px-4 py-2 bg-amber-400 hover:bg-amber-500 text-gray-950 font-bold rounded-xl text-[10px] transition-all shadow-md tactile-btn">
                    Resend Verification Link
                </button>
            </div>

            <button id="login-btn" onclick="handleLogin()" class="w-full py-4 bg-gradient-to-r from-green-500 via-emerald-600 to-green-600 text-white font-black rounded-2xl text-xs shadow-[0_10px_25px_rgba(34,197,94,0.4)] mb-4 tactile-btn btn-shimmer animate-form flex items-center justify-center">
                Log In
            </button>

            <p class="text-center text-xs text-gray-300 animate-form">Don't have an account? <a href="anpregister.html" class="text-green-400 font-bold hover:underline">Register Now</a></p>
        </div>
    </div>

    <!-- CUSTOM ANIMATED MODAL SYSTEM -->
    <div id="anp-custom-modal" class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-gray-900 border border-green-500/40 rounded-[36px] p-7 max-w-sm w-full text-center shadow-2xl animate-modal-pop relative overflow-hidden">
            <div class="absolute -top-12 -right-12 w-32 h-32 bg-green-500/15 rounded-full blur-2xl pointer-events-none"></div>
            <div id="modal-icon-container" class="my-3 flex justify-center"></div>
            <h3 id="modal-title" class="text-lg font-black text-white mb-1.5 tracking-tight">Notice</h3>
            <p id="modal-text" class="text-xs text-gray-300 mb-6 leading-relaxed px-2">Message goes here.</p>
            <div id="modal-buttons"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, sendEmailVerification, signOut } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDZb4KcR5Tvw3x_ipR2ocgdUDqh47Arz6M",
            authDomain: "anp-money.firebaseapp.com",
            projectId: "anp-money",
            storageBucket: "anp-money.firebasestorage.app",
            messagingSenderId: "581687927989",
            appId: "1:581687927989:web:41218431483f24a18b0afc"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        let lastAttemptedUser = null;

        window.showAnpAlert = function(title, message, isSuccess = true) {
            return new Promise((resolve) => {
                const modal = document.getElementById("anp-custom-modal");
                document.getElementById("modal-title").innerText = title;
                document.getElementById("modal-text").innerText = message;
                const iconContainer = document.getElementById("modal-icon-container");
                if (isSuccess) {
                    iconContainer.innerHTML = `<div class="w-20 h-20 bg-green-500/15 border border-green-500/40 rounded-full flex items-center justify-center gpay-circle shadow-[0_0_30px_rgba(34,197,94,0.3)]"><svg class="w-10 h-10 text-green-400" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path class="gpay-check" stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg></div>`;
                } else {
                    iconContainer.innerHTML = `<div class="w-20 h-20 bg-red-500/15 border border-red-500/40 rounded-full flex items-center justify-center gpay-circle shadow-[0_0_30px_rgba(239,68,68,0.3)]"><i class="fas fa-exclamation-triangle text-red-400 text-2xl"></i></div>`;
                }
                const btnContainer = document.getElementById("modal-buttons");
                btnContainer.innerHTML = `<button id="modal-ok-btn" class="w-full py-3.5 bg-gradient-to-r from-green-500 to-emerald-600 text-white font-bold rounded-2xl text-xs shadow-lg tactile-btn">Acknowledge</button>`;
                modal.classList.remove("hidden");
                document.getElementById("modal-ok-btn").onclick = () => { modal.classList.add("hidden"); resolve(true); };
            });
        };

        window.togglePasswordVisibility = function() {
            const pwdInput = document.getElementById("login-password");
            const eyeIcon = document.getElementById("eye-icon");
            if (pwdInput.type === "password") {
                pwdInput.type = "text";
                eyeIcon.className = "fas fa-eye-slash";
            } else {
                pwdInput.type = "password";
                eyeIcon.className = "fas fa-eye";
            }
        }

        window.handleLogin = async function() {
            const email = document.getElementById("login-email").value.trim();
            const password = document.getElementById("login-password").value.trim();
            const loginBtn = document.getElementById("login-btn");
            const warningBox = document.getElementById("verification-warning-box");

            warningBox.classList.add("hidden");

            if (!email || !password) {
                await showAnpAlert("Input Required", "Please enter both email and password.", false);
                return;
            }

            loginBtn.disabled = true;
            loginBtn.innerHTML = `<i class="fas fa-spinner fa-spin mr-2"></i> Authenticating...`;

            try {
                const creds = await signInWithEmailAndPassword(auth, email, password);
                const user = creds.user;
                lastAttemptedUser = user;

                if (!user.emailVerified) {
                    warningBox.classList.remove("hidden");
                    await signOut(auth);
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = "Log In";
                    return;
                }

                window.location.href = "index.html";
            } catch (e) {
                let friendlyMsg = e.message;
                if (e.code === 'auth/invalid-credential' || e.code === 'auth/wrong-password' || e.code === 'auth/user-not-found') {
                    friendlyMsg = "Incorrect email or password. Please try again.";
                }
                await showAnpAlert("Authentication Error", friendlyMsg, false);
                loginBtn.disabled = false;
                loginBtn.innerHTML = "Log In";
            }
        }

        window.resendVerificationEmail = async function() {
            if (!lastAttemptedUser) {
                await showAnpAlert("Notice", "Please try logging in first so we can identify your account.", false);
                return;
            }
            try {
                await sendEmailVerification(lastAttemptedUser);
                await showAnpAlert("Dispatched", "Verification link resent! Please check your inbox or spam folder.", true);
            } catch (e) {
                await showAnpAlert("Error", "Error sending verification email: " + e.message, false);
            }
        }

        document.addEventListener('click', function (e) {
            const target = e.target.closest('.tactile-btn');
            if (!target) return;
            const existingRipple = target.querySelector('.ripple');
            if (existingRipple) existingRipple.remove();
            const circle = document.createElement('span');
            const rect = target.getBoundingClientRect();
            const diameter = Math.max(rect.width, rect.height);
            const radius = diameter / 2;
            circle.style.width = circle.style.height = `${diameter}px`;
            circle.style.left = `${e.clientX - rect.left - radius}px`;
            circle.style.top = `${e.clientY - rect.top - radius}px`;
            circle.classList.add('ripple');
            target.appendChild(circle);
            setTimeout(() => circle.remove(), 600);
        });
    </script>
</body>
</html>
