<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ANP MONEY - Login</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a1f12 0%, #000000 100%);
            -webkit-tap-highlight-color: transparent;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }
        body::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(circle at 20% 20%, rgba(45,164,90,0.15), transparent 40%), 
                        radial-gradient(circle at 80% 80%, rgba(0,255,150,0.08), transparent 45%);
        }
        .glass-card {
            background: rgba(15, 30, 20, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 25px 50px rgba(0,0,0,0.7);
        }
        @keyframes scaleUpModal {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-modal-pop {
            animation: scaleUpModal 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .app-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="glass-card rounded-[32px] p-8 text-white shadow-2xl animate-modal-pop relative overflow-hidden">
            <!-- Ambient Card Orb -->
            <div class="absolute -top-12 -right-12 w-32 h-32 bg-green-500/20 rounded-full blur-2xl pointer-events-none"></div>

            <div class="text-center mb-7 relative z-10">
                <div class="w-16 h-16 bg-gradient-to-br from-green-400 to-emerald-600 rounded-2xl flex items-center justify-center mx-auto mb-4 text-white text-2xl shadow-[0_10px_25px_rgba(34,197,94,0.4)]">
                    <i class="fas fa-bicycle"></i>
                </div>
                <h2 class="text-2xl font-black tracking-tight text-white">Welcome Back</h2>
                <p class="text-xs text-gray-300 mt-1">Log in to your ANP Money Dashboard</p>
            </div>

            <div class="flex flex-col gap-3.5 mb-5 relative z-10">
                <div>
                    <label class="text-[11px] text-green-300 font-semibold mb-1 block">Email Address</label>
                    <input type="email" id="login-email" placeholder="Enter your email" class="w-full bg-black/40 border border-white/15 rounded-2xl px-4 py-3 text-xs text-white outline-none focus:border-green-400 focus:ring-2 focus:ring-green-400/20 transition-all">
                </div>
                <div>
                    <label class="text-[11px] text-green-300 font-semibold mb-1 block">Password</label>
                    <div class="relative">
                        <input type="password" id="login-password" placeholder="Enter password" class="w-full bg-black/40 border border-white/15 rounded-2xl px-4 py-3 pr-10 text-xs text-white outline-none focus:border-green-400 focus:ring-2 focus:ring-green-400/20 transition-all">
                        <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-white text-xs">
                            <i id="eye-icon" class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Unverified warning container -->
            <div id="verification-warning-box" class="hidden mb-4 bg-amber-500/15 border border-amber-500/40 rounded-2xl p-3.5 text-center relative z-10">
                <p class="text-[11px] text-amber-300 font-medium mb-2.5">Your email is not verified yet! Please check your inbox or spam folder.</p>
                <button onclick="resendVerificationEmail()" class="px-3.5 py-2 bg-amber-400 hover:bg-amber-500 text-gray-950 font-bold rounded-xl text-[10px] transition-all shadow-md active:scale-95">
                    Resend Verification Link
                </button>
            </div>

            <button id="login-btn" onclick="handleLogin()" class="w-full py-3.5 bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-600 hover:to-emerald-700 text-white font-bold rounded-2xl text-xs shadow-[0_8px_20px_rgba(34,197,94,0.3)] mb-4 transition-all active:scale-95 flex items-center justify-center relative z-10">
                Log In
            </button>

            <p class="text-center text-xs text-gray-300 relative z-10">Don't have an account? <a href="anpregister.html" class="text-green-400 font-bold hover:underline">Register Now</a></p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, sendEmailVerification, signOut } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDZb4KcR5Tvw3x_ipR2ocgdUDqh47Arz6M",
            authDomain: "anp-money.firebaseapp.com",
            projectId: "anp-money",
            storageBucket: "anp-money.firebasestorage.app",
            messagingSenderId: "581687927989",
            appId: "1:581687927989:web:41218431483f24a18b0afc"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        let lastAttemptedUser = null;

        window.togglePasswordVisibility = function() {
            const pwdInput = document.getElementById("login-password");
            const eyeIcon = document.getElementById("eye-icon");
            if (pwdInput.type === "password") {
                pwdInput.type = "text";
                eyeIcon.className = "fas fa-eye-slash";
            } else {
                pwdInput.type = "password";
                eyeIcon.className = "fas fa-eye";
            }
        }

        window.handleLogin = async function() {
            const email = document.getElementById("login-email").value.trim();
            const password = document.getElementById("login-password").value.trim();
            const loginBtn = document.getElementById("login-btn");
            const warningBox = document.getElementById("verification-warning-box");

            warningBox.classList.add("hidden");

            if (!email || !password) {
                alert("Please enter both email and password.");
                return;
            }

            loginBtn.disabled = true;
            loginBtn.innerHTML = `<i class="fas fa-spinner fa-spin mr-2"></i> Logging in...`;

            try {
                const creds = await signInWithEmailAndPassword(auth, email, password);
                const user = creds.user;
                lastAttemptedUser = user;

                if (!user.emailVerified) {
                    warningBox.classList.remove("hidden");
                    await signOut(auth);
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = "Log In";
                    return;
                }

                window.location.href = "index.html";
            } catch (e) {
                let friendlyMsg = e.message;
                if (e.code === 'auth/invalid-credential' || e.code === 'auth/wrong-password' || e.code === 'auth/user-not-found') {
                    friendlyMsg = "Incorrect email or password. Please try again.";
                }
                alert("Login Error: " + friendlyMsg);
                loginBtn.disabled = false;
                loginBtn.innerHTML = "Log In";
            }
        }

        window.resendVerificationEmail = async function() {
            if (!lastAttemptedUser) {
                alert("Please try logging in first so we can identify your account.");
                return;
            }
            try {
                await sendEmailVerification(lastAttemptedUser);
                alert("Verification link resent! Please check your inbox or spam folder.");
            } catch (e) {
                alert("Error sending verification email: " + e.message);
            }
        }
    </script>
</body>
</html>
