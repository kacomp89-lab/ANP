<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANP MONEY - Login</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; background: #0b1a10; color: white; }</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-gray-900 border border-green-900/60 rounded-3xl p-8 max-w-sm w-full shadow-2xl">
        <div class="text-center mb-6">
            <div class="w-12 h-12 bg-green-500/20 border border-green-500 rounded-full flex items-center justify-center mx-auto mb-3 text-green-400 text-lg">
                <i class="fas fa-bicycle"></i>
            </div>
            <h2 class="text-xl font-black text-green-400">Welcome Back</h2>
            <p class="text-xs text-gray-400 mt-1">Log in to your ANP Money Dashboard</p>
        </div>

        <div class="flex flex-col gap-3 mb-5">
            <div>
                <label class="text-[10px] text-green-300 font-semibold mb-1 block">Email Address</label>
                <input type="email" id="login-email" placeholder="Enter your email" class="w-full bg-black/50 border border-green-800 rounded-xl px-3 py-2.5 text-xs text-white outline-none focus:border-green-400">
            </div>
            <div>
                <label class="text-[10px] text-green-300 font-semibold mb-1 block">Password</label>
                <div class="relative">
                    <input type="password" id="login-password" placeholder="Enter password" class="w-full bg-black/50 border border-green-800 rounded-xl px-3 py-2.5 pr-10 text-xs text-white outline-none focus:border-green-400">
                    <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-white text-xs">
                        <i id="eye-icon" class="fas fa-eye"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Unverified warning container (Hidden by default) -->
        <div id="verification-warning-box" class="hidden mb-4 bg-yellow-500/10 border border-yellow-500/40 rounded-xl p-3 text-center">
            <p class="text-[11px] text-yellow-300 font-medium mb-2">Your email is not verified yet! Please check your inbox or spam folder.</p>
            <button onclick="resendVerificationEmail()" class="px-3 py-1.5 bg-yellow-500 hover:bg-yellow-600 text-gray-950 font-bold rounded-lg text-[10px] transition-all">
                Resend Verification Link
            </button>
        </div>

        <button id="login-btn" onclick="handleLogin()" class="w-full py-3 bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-600 hover:to-emerald-700 text-white font-bold rounded-xl text-xs shadow-lg mb-3 transition-all flex items-center justify-center">
            Log In
        </button>

        <p class="text-center text-xs text-gray-400">Don't have an account? <a href="anpregister.html" class="text-green-400 font-bold hover:underline">Register Now</a></p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, sendEmailVerification, signOut } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDZb4KcR5Tvw3x_ipR2ocgdUDqh47Arz6M",
            authDomain: "anp-money.firebaseapp.com",
            projectId: "anp-money",
            storageBucket: "anp-money.firebasestorage.app",
            messagingSenderId: "581687927989",
            appId: "1:581687927989:web:41218431483f24a18b0afc"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        let lastAttemptedUser = null;

        window.togglePasswordVisibility = function() {
            const pwdInput = document.getElementById("login-password");
            const eyeIcon = document.getElementById("eye-icon");
            if (pwdInput.type === "password") {
                pwdInput.type = "text";
                eyeIcon.className = "fas fa-eye-slash";
            } else {
                pwdInput.type = "password";
                eyeIcon.className = "fas fa-eye";
            }
        }

        window.handleLogin = async function() {
            const email = document.getElementById("login-email").value.trim();
            const password = document.getElementById("login-password").value.trim();
            const loginBtn = document.getElementById("login-btn");
            const warningBox = document.getElementById("verification-warning-box");

            warningBox.classList.add("hidden");

            if (!email || !password) {
                alert("Please enter both email and password.");
                return;
            }

            loginBtn.disabled = true;
            loginBtn.innerHTML = `<i class="fas fa-spinner fa-spin mr-2"></i> Logging in...`;

            try {
                const creds = await signInWithEmailAndPassword(auth, email, password);
                const user = creds.user;
                lastAttemptedUser = user;

                // Check if email is verified
                if (!user.emailVerified) {
                    warningBox.classList.remove("hidden");
                    await signOut(auth);
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = "Log In";
                    return;
                }

                // Success! Redirect to dashboard
                window.location.href = "index.html";
            } catch (e) {
                let friendlyMsg = e.message;
                if (e.code === 'auth/invalid-credential' || e.code === 'auth/wrong-password' || e.code === 'auth/user-not-found') {
                    friendlyMsg = "Incorrect email or password. Please try again.";
                }
                alert("Login Error: " + friendlyMsg);
                loginBtn.disabled = false;
                loginBtn.innerHTML = "Log In";
            }
        }

        window.resendVerificationEmail = async function() {
            if (!lastAttemptedUser) {
                alert("Please try logging in first so we can identify your account.");
                return;
            }
            try {
                await sendEmailVerification(lastAttemptedUser);
                alert("Verification link resent! Please check your inbox or spam folder.");
            } catch (e) {
                alert("Error sending verification email: " + e.message);
            }
        }
    </script>
</body>
</html>
