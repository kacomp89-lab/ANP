<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ANP MONEY - Secure Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: #020b05;
            color: #e2e8f0;
            -webkit-tap-highlight-color: transparent;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }
        .font-mono { font-family: 'JetBrains Mono', monospace; }

        /* Ambient Floating Cyber Orbs */
        .orb-1 {
            position: absolute; top: -10%; left: -10%; width: 350px; height: 350px;
            background: radial-gradient(circle, rgba(16,185,129,0.2) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%; animation: floatOrb 8s infinite alternate ease-in-out; pointer-events: none;
        }
        .orb-2 {
            position: absolute; bottom: -10%; right: -10%; width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(5,150,105,0.15) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%; animation: floatOrb 10s infinite alternate-reverse ease-in-out; pointer-events: none;
        }
        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 40px) scale(1.1); }
        }

        .glass-card {
            background: rgba(10, 24, 15, 0.75);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 30px 60px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.1);
        }

        /* Tactile Button & Ripple Physics */
        .tactile-btn {
            position: relative; overflow: hidden; transform: translateZ(0);
            transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.15s ease, filter 0.15s ease;
            cursor: pointer; -webkit-user-select: none; user-select: none;
        }
        .tactile-btn:hover { filter: brightness(1.08); }
        .tactile-btn:active { transform: scale(0.93) translateY(1px) !important; box-shadow: 0 2px 8px rgba(34, 197, 94, 0.25) !important; }

        .ripple {
            position: absolute; background: radial-gradient(circle, rgba(255, 255, 255, 0.6) 0%, rgba(255, 255, 255, 0) 70%);
            border-radius: 50%; transform: scale(0); animation: rippleEffect 0.55s cubic-bezier(0.4, 0, 0.2, 1) forwards; pointer-events: none;
        }
        @keyframes rippleEffect {
            0% { transform: scale(0); opacity: 0.8; }
            100% { transform: scale(4.5); opacity: 0; }
        }

        @keyframes scaleUpModal {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-modal-pop { animation: scaleUpModal 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        @keyframes circleScale {
            0% { transform: scale(0); opacity: 0; }
            60% { transform: scale(1.12); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes checkmarkDraw {
            0% { stroke-dashoffset: 48; }
            100% { stroke-dashoffset: 0; }
        }
        .gpay-circle { animation: circleScale 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .gpay-check { stroke-dasharray: 48; stroke-dashoffset: 48; animation: checkmarkDraw 0.4s 0.25s ease-in-out forwards; }

        .app-container {
            width: 100%; max-width: 430px; height: 100dvh; background: #07130a;
            position: relative; display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 25px 50px rgba(0,0,0,0.8);
        }
        @media (min-width: 640px) {
            .app-container { height: 880px; max-height: 92vh; border-radius: 36px; border: 8px solid rgba(255,255,255,0.12); }
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>

    <div class="orb-1"></div>
    <div class="orb-2"></div>

    <div class="app-container">
        <!-- Header -->
        <header class="bg-gradient-to-r from-green-600 to-emerald-700 pt-5 px-5 pb-4 text-white flex items-center justify-between shadow-lg z-20 flex-shrink-0">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-white/20 flex items-center justify-center text-white text-base shadow-sm backdrop-blur-md">
                    <i class="fas fa-bicycle"></i>
                </div>
                <div>
                    <h1 class="text-sm font-black tracking-tight" id="user-display-name">ANP Partner</h1>
                    <span id="user-vip-badge" class="text-[10px] bg-white/20 px-2 py-0.5 rounded-full font-mono font-bold">VIP1 ACTIVE</span>
                </div>
            </div>
            <button onclick="handleLogout()" class="w-8 h-8 rounded-xl bg-white/20 flex items-center justify-center text-white text-xs hover:bg-white/30 transition-all backdrop-blur-md tactile-btn" title="Log Out">
                <i class="fas fa-sign-out-alt"></i>
            </button>
        </header>

        <!-- Main Scrollable Dashboard Content -->
        <main class="flex-1 overflow-y-auto p-4 flex flex-col gap-4 hide-scrollbar pb-[110px]">
            
            <!-- Wallet Card -->
            <div class="glass-card rounded-3xl p-5 relative overflow-hidden">
                <div class="absolute -right-8 -bottom-8 w-28 h-28 bg-green-500/20 rounded-full blur-xl pointer-events-none"></div>
                <span class="text-[11px] text-green-300 font-bold uppercase tracking-wider block mb-1">Total Available Balance</span>
                <div class="text-3xl font-black text-white font-mono mb-3" id="wallet-balance">₹0.00</div>
                
                <div class="grid grid-cols-2 gap-2 pt-3 border-t border-white/10">
                    <div>
                        <span class="text-[10px] text-gray-400 block uppercase">Today Earnings</span>
                        <span class="text-xs font-bold text-green-400 font-mono" id="today-earnings">₹0</span>
                    </div>
                    <div>
                        <span class="text-[10px] text-gray-400 block uppercase">Total Revenue</span>
                        <span class="text-xs font-bold text-emerald-300 font-mono" id="total-revenue">₹0</span>
                    </div>
                </div>
            </div>

            <!-- Quick Action Grid -->
            <div class="grid grid-cols-3 gap-2.5">
                <button onclick="window.location.href='recharge.html'" class="glass-card p-3 rounded-2xl flex flex-col items-center justify-center gap-1.5 text-center tactile-btn hover:border-green-500/50 transition-all">
                    <div class="w-10 h-10 rounded-xl bg-green-500/20 text-green-400 flex items-center justify-center text-sm">
                        <i class="fas fa-wallet"></i>
                    </div>
                    <span class="text-[11px] font-bold text-white">Deposit</span>
                </button>
                <button onclick="window.location.href='delivery.html'" class="glass-card p-3 rounded-2xl flex flex-col items-center justify-center gap-1.5 text-center tactile-btn hover:border-green-500/50 transition-all">
                    <div class="w-10 h-10 rounded-xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-sm">
                        <i class="fas fa-box"></i>
                    </div>
                    <span class="text-[11px] font-bold text-white">Delivery</span>
                </button>
                <button onclick="window.location.href='referral.html'" class="glass-card p-3 rounded-2xl flex flex-col items-center justify-center gap-1.5 text-center tactile-btn hover:border-green-500/50 transition-all">
                    <div class="w-10 h-10 rounded-xl bg-teal-500/20 text-teal-400 flex items-center justify-center text-sm">
                        <i class="fas fa-users"></i>
                    </div>
                    <span class="text-[11px] font-bold text-white">Promotion</span>
                </button>
            </div>

            <!-- VIP Tier Perks Card -->
            <div class="glass-card rounded-3xl p-5">
                <h3 class="text-xs font-bold text-green-300 uppercase tracking-wider mb-3 flex items-center gap-2">
                    <i class="fas fa-crown text-yellow-400"></i> Partner VIP Status
                </h3>
                <div class="flex items-center justify-between bg-black/40 border border-white/10 rounded-2xl p-3.5 mb-3">
                    <div>
                        <span class="text-xs font-bold text-white block" id="current-tier-title">VIP Level 1 Partner</span>
                        <span class="text-[10px] text-gray-400 block mt-0.5">Daily automated rewards active</span>
                    </div>
                    <span class="px-3 py-1 bg-green-500/20 border border-green-500/40 text-green-400 text-[10px] font-mono font-bold rounded-full">ACTIVE</span>
                </div>
                <button onclick="window.location.href='recharge.html'" class="w-full py-3 bg-gradient-to-r from-green-500 to-emerald-600 text-white font-bold rounded-xl text-xs shadow-lg tactile-btn">
                    Upgrade VIP Package
                </button>
            </div>
        </main>

        <!-- Bottom Navigation Bar -->
        <nav class="absolute bottom-0 w-full bg-gray-950/90 backdrop-blur-xl border-t border-white/10 flex justify-between items-center px-6 pt-2 pb-5 z-40 shadow-2xl">
            <button onclick="window.location.href='index.html'" class="flex flex-col items-center text-green-400 group">
                <i class="fas fa-home text-lg mb-1"></i>
                <span class="text-[10px] font-bold">Home</span>
            </button>
            <button onclick="window.location.href='delivery.html'" class="flex flex-col items-center text-gray-400 hover:text-green-400 transition-colors">
                <i class="fas fa-box text-lg mb-1"></i>
                <span class="text-[10px] font-medium">Delivery</span>
            </button>
            <div class="relative -top-6">
                <button onclick="window.location.href='index.html'" class="w-14 h-14 bg-gradient-to-br from-green-400 to-green-600 rounded-full flex items-center justify-center text-white border-4 border-[#07130a] shadow-[0_5px_20px_rgba(34,197,94,0.5)] tactile-btn">
                    <i class="fas fa-bicycle text-2xl"></i>
                </button>
            </div>
            <button onclick="window.location.href='map.html'" class="flex flex-col items-center text-gray-400 hover:text-green-400 transition-colors">
                <i class="fas fa-map-marked-alt text-lg mb-1"></i>
                <span class="text-[10px] font-medium">Map</span>
            </button>
            <button onclick="window.location.href='my.html'" class="flex flex-col items-center text-gray-400 hover:text-green-400 transition-colors">
                <i class="fas fa-user text-lg mb-1"></i>
                <span class="text-[10px] font-medium">My</span>
            </button>
        </nav>
    </div>

    <!-- CUSTOM ANIMATED MODAL SYSTEM -->
    <div id="anp-custom-modal" class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-gray-900 border border-green-500/40 rounded-[36px] p-7 max-w-sm w-full text-center shadow-2xl animate-modal-pop relative overflow-hidden">
            <div class="absolute -top-12 -right-12 w-32 h-32 bg-green-500/15 rounded-full blur-2xl pointer-events-none"></div>
            <div id="modal-icon-container" class="my-3 flex justify-center"></div>
            <h3 id="modal-title" class="text-lg font-black text-white mb-1.5 tracking-tight">Notice</h3>
            <p id="modal-text" class="text-xs text-gray-300 mb-6 leading-relaxed px-2">Message goes here.</p>
            <div id="modal-buttons"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDZb4KcR5Tvw3x_ipR2ocgdUDqh47Arz6M",
            authDomain: "anp-money.firebaseapp.com",
            projectId: "anp-money",
            storageBucket: "anp-money.firebasestorage.app",
            messagingSenderId: "581687927989",
            appId: "1:581687927989:web:41218431483f24a18b0afc"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.showAnpAlert = function(title, message, isSuccess = true) {
            return new Promise((resolve) => {
                const modal = document.getElementById("anp-custom-modal");
                document.getElementById("modal-title").innerText = title;
                document.getElementById("modal-text").innerText = message;
                const iconContainer = document.getElementById("modal-icon-container");
                if (isSuccess) {
                    iconContainer.innerHTML = `<div class="w-20 h-20 bg-green-500/15 border border-green-500/40 rounded-full flex items-center justify-center gpay-circle shadow-[0_0_30px_rgba(34,197,94,0.3)]"><svg class="w-10 h-10 text-green-400" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path class="gpay-check" stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg></div>`;
                } else {
                    iconContainer.innerHTML = `<div class="w-20 h-20 bg-red-500/15 border border-red-500/40 rounded-full flex items-center justify-center gpay-circle shadow-[0_0_30px_rgba(239,68,68,0.3)]"><i class="fas fa-exclamation-triangle text-red-400 text-2xl"></i></div>`;
                }
                const btnContainer = document.getElementById("modal-buttons");
                btnContainer.innerHTML = `<button id="modal-ok-btn" class="w-full py-3.5 bg-gradient-to-r from-green-500 to-emerald-600 text-white font-bold rounded-2xl text-xs shadow-lg tactile-btn">Acknowledge</button>`;
                modal.classList.remove("hidden");
                document.getElementById("modal-ok-btn").onclick = () => { modal.classList.add("hidden"); resolve(true); };
            });
        };

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "ANP.HTML";
                return;
            }
            document.getElementById("user-display-name").innerText = user.displayName || "ANP Partner";
            try {
                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (userDoc.exists()) {
                    const data = userDoc.data();
                    document.getElementById("wallet-balance").innerText = "₹" + (data.balance || 0).toLocaleString();
                    document.getElementById("today-earnings").innerText = "₹" + (data.todayEarnings || 0).toLocaleString();
                    document.getElementById("total-revenue").innerText = "₹" + (data.totalRevenue || 0).toLocaleString();
                    const tier = data.partnerLevel || "VIP1";
                    document.getElementById("user-vip-badge").innerText = tier + " ACTIVE";
                    document.getElementById("current-tier-title").innerText = tier + " Partner Status";
                }
            } catch (e) {
                console.error("Error loading user data:", e);
            }
        });

        window.handleLogout = async function() {
            await signOut(auth);
            window.location.href = "ANP.HTML";
        }

        // Ripple listener
        document.addEventListener('click', function (e) {
            const target = e.target.closest('.tactile-btn');
            if (!target) return;
            const existingRipple = target.querySelector('.ripple');
            if (existingRipple) existingRipple.remove();
            const circle = document.createElement('span');
            const rect = target.getBoundingClientRect();
            const diameter = Math.max(rect.width, rect.height);
            const radius = diameter / 2;
            circle.style.width = circle.style.height = `${diameter}px`;
            circle.style.left = `${e.clientX - rect.left - radius}px`;
            circle.style.top = `${e.clientY - rect.top - radius}px`;
            circle.classList.add('ripple');
            target.appendChild(circle);
            setTimeout(() => circle.remove(), 600);
        });
    </script>
</body>
</html>
