<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANP Money - Secure Admin Panel</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #0b1a10; color: white; }
    </style>
</head>
<body class="min-h-screen p-6 flex flex-col justify-between">
    <div class="max-w-4xl mx-auto w-full">
        
        <!-- Header -->
        <div class="flex justify-between items-center mb-8 border-b border-green-900 pb-4">
            <div>
                <h1 class="text-2xl font-black tracking-tight text-green-400">ANP MONEY ADMIN</h1>
                <p class="text-xs text-gray-400 mt-1">Secure Team Verification Portal</p>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="lockAdminSession()" id="lock-btn" class="px-3 py-2 bg-red-900/40 hover:bg-red-900/70 text-red-300 text-xs font-bold rounded-xl transition-all hidden" title="Lock Admin Panel">
                    <i class="fas fa-lock"></i> Lock
                </button>
                <button onclick="window.location.href='index.html'" class="px-4 py-2 bg-green-800 hover:bg-green-700 text-xs font-bold rounded-xl transition-all">
                    Back to App
                </button>
            </div>
        </div>

        <!-- PIN Gate Card (Shown if team member hasn't entered PIN) -->
        <div id="pin-gate-card" class="bg-gray-900 border border-green-900/60 rounded-3xl p-8 shadow-2xl max-w-sm mx-auto text-center my-12">
            <div class="w-14 h-14 bg-yellow-500/20 border border-yellow-500 rounded-full flex items-center justify-center mx-auto mb-4 text-yellow-400 text-xl shadow-lg">
                <i class="fas fa-key"></i>
            </div>
            <h2 class="text-lg font-bold text-white mb-1">Team PIN Required</h2>
            <p class="text-xs text-gray-400 mb-6">Enter your authorized team PIN to access payment verifications.</p>
            
            <div class="mb-4">
                <input type="password" id="team-pin-input" placeholder="Enter Admin PIN" maxlength="6" class="w-full bg-black/60 border border-green-800 rounded-2xl px-4 py-3 text-center text-white tracking-widest text-lg outline-none focus:border-green-500 shadow-inner">
            </div>

            <button onclick="verifyTeamPin()" class="w-full py-3.5 bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-600 hover:to-emerald-700 text-white font-bold rounded-2xl text-xs shadow-lg transition-all">
                Unlock Admin Panel
            </button>
            <p id="pin-error" class="text-red-400 text-[11px] font-semibold mt-3 hidden">Incorrect PIN. Please try again.</p>
        </div>

        <!-- Pending Deposits Container (Hidden until PIN is verified) -->
        <div id="admin-dashboard-container" class="bg-gray-900 border border-green-900/60 rounded-3xl p-6 shadow-2xl hidden">
            <h2 class="text-sm font-bold text-green-300 mb-4 flex items-center gap-2">
                <i class="fas fa-clock"></i> Pending Payment Requests
            </h2>

            <div id="admin-deposit-list" class="flex flex-col gap-4">
                <div class="text-center py-12 text-gray-500 text-xs">
                    <i class="fas fa-spinner fa-spin text-lg mb-2 text-green-500"></i>
                    <p>Loading pending deposits...</p>
                </div>
            </div>
        </div>

    </div>

    <!-- Footer note -->
    <footer class="text-center text-[10px] text-gray-600 mt-8">
        ANP Green Ride Secure Partner Management System
    </footer>

    <!-- Admin Script Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";
        import { getFirestore, collection, query, where, getDocs, doc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDZb4KcR5Tvw3x_ipR2ocgdUDqh47Arz6M",
            authDomain: "anp-money.firebaseapp.com",
            projectId: "anp-money",
            storageBucket: "anp-money.firebasestorage.app",
            messagingSenderId: "581687927989",
            appId: "1:581687927989:web:41218431483f24a18b0afc"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // ==========================================
        // SET YOUR TEAM ADMIN PIN HERE (Change anytime)
        // ==========================================
        const CORRECT_ADMIN_PIN = "7860"; 
        // ==========================================

        // Check on load if already unlocked in this browser session
        window.addEventListener('DOMContentLoaded', () => {
            const isUnlocked = localStorage.getItem("anp_admin_unlocked");
            if (isUnlocked === "true") {
                unlockAdminUI();
            }
        });

        window.verifyTeamPin = async function() {
            const enteredPin = document.getElementById("team-pin-input").value.trim();
            const errorText = document.getElementById("pin-error");

            if (enteredPin === CORRECT_ADMIN_PIN) {
                errorText.classList.add("hidden");
                localStorage.setItem("anp_admin_unlocked", "true");
                unlockAdminUI();
            } else {
                errorText.classList.remove("hidden");
                document.getElementById("team-pin-input").value = "";
            }
        }

        async function unlockAdminUI() {
            document.getElementById("pin-gate-card").classList.add("hidden");
            document.getElementById("admin-dashboard-container").classList.remove("hidden");
            document.getElementById("lock-btn").classList.remove("hidden");

            // Ensure Firebase has an active session to read/write Firestore
            if (!auth.currentUser) {
                try {
                    await signInAnonymously(auth);
                } catch (e) {
                    console.error("Auth error:", e);
                }
            }

            loadPendingDeposits();
        }

        window.lockAdminSession = function() {
            localStorage.removeItem("anp_admin_unlocked");
            location.reload();
        }

        async function loadPendingDeposits() {
            const container = document.getElementById("admin-deposit-list");
            container.innerHTML = `<div class="text-center py-8 text-gray-500 text-xs">Fetching records...</div>`;

            try {
                const q = query(collection(db, "deposits"), where("status", "==", "pending"));
                const querySnapshot = await getDocs(q);

                container.innerHTML = "";

                if (querySnapshot.empty) {
                    container.innerHTML = `
                        <div class="text-center py-12 text-gray-500 text-xs">
                            <i class="fas fa-check-circle text-2xl text-green-600 mb-2"></i>
                            <p>No pending payment requests right now!</p>
                        </div>
                    `;
                    return;
                }

                querySnapshot.forEach((docSnap) => {
                    const deposit = docSnap.data();
                    const depositId = docSnap.id;
                    const dateStr = deposit.createdAt ? new Date(deposit.createdAt).toLocaleString('en-IN') : 'Recent';

                    const card = `
                        <div class="bg-black/40 border border-green-900/40 rounded-2xl p-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                            <div>
                                <div class="flex items-center gap-2 mb-1">
                                    <span class="text-xs font-bold text-white">${deposit.email || 'Partner'}</span>
                                    <span class="bg-yellow-500/20 text-yellow-300 text-[9px] font-bold px-2 py-0.5 rounded-full">Pending Verification</span>
                                </div>
                                <p class="text-xs text-gray-300">Package Price: <span class="font-extrabold text-green-400">₹${(deposit.amount || 0).toLocaleString()}</span></p>
                                <p class="text-xs text-gray-300">UTR Reference: <span class="font-mono text-yellow-300 font-bold bg-black/60 px-2 py-0.5 rounded">${deposit.utr}</span></p>
                                <p class="text-[10px] text-gray-500 mt-1">${dateStr}</p>
                            </div>
                            <button onclick="approveDeposit('${depositId}', '${deposit.uid}', ${deposit.amount})" class="w-full sm:w-auto px-5 py-2.5 bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-600 hover:to-emerald-700 text-white font-bold rounded-xl text-xs shadow-lg transition-all">
                                <i class="fas fa-check mr-1"></i> Verify & Activate VIP Pack
                            </button>
                        </div>
                    `;
                    container.innerHTML += card;
                });

            } catch (error) {
                console.error("Error loading pending deposits:", error);
                container.innerHTML = `<p class="text-red-400 text-xs text-center py-4">Error loading deposits: ${error.message}</p>`;
            }
        }

        window.approveDeposit = async function(depositId, userId, depositAmount) {
            let vipLevel = "VIP1";
            let dailyReward = 50;

            if (depositAmount >= 20000) {
                vipLevel = "VIP4";
                dailyReward = 2000;
            } else if (depositAmount >= 4999) {
                vipLevel = "VIP3";
                dailyReward = 500;
            } else if (depositAmount >= 1299) {
                vipLevel = "VIP2";
                dailyReward = 130;
            } else if (depositAmount >= 499) {
                vipLevel = "VIP1";
                dailyReward = 50;
            }

            if (!confirm(`Verify payment of ₹${depositAmount}?\n\nThis will activate partner tier [${vipLevel}] and credit daily reward of ₹${dailyReward} to their balance.`)) {
                return;
            }

            try {
                const userRef = doc(db, "users", userId);
                
                await updateDoc(userRef, {
                    partnerLevel: vipLevel,
                    balance: increment(dailyReward),
                    todayEarnings: increment(dailyReward),
                    totalRevenue: increment(dailyReward)
                });

                const depositRef = doc(db, "deposits", depositId);
                await updateDoc(depositRef, {
                    status: "approved",
                    activatedLevel: vipLevel,
                    rewardCredited: dailyReward
                });

                alert(`Successfully activated ${vipLevel}! Daily reward of ₹${dailyReward} credited to partner balance.`);
                loadPendingDeposits();
            } catch (error) {
                alert("Error approving payment: " + error.message);
            }
        };
    </script>
</body>
</html>
