<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANP Money - Admin Verification Panel</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #0b1a10; color: white; }
    </style>
</head>
<body class="min-h-screen p-6">
    <div class="max-w-4xl mx-auto">
        
        <!-- Header -->
        <div class="flex justify-between items-center mb-8 border-b border-green-900 pb-4">
            <div>
                <h1 class="text-2xl font-black tracking-tight text-green-400">ANP MONEY ADMIN</h1>
                <p class="text-xs text-gray-400 mt-1">Pending UPI UTR Deposit Verifications</p>
            </div>
            <div class="flex items-center gap-3">
                <span id="admin-user-email" class="text-xs text-gray-300 hidden sm:inline">Checking auth...</span>
                <button onclick="window.location.href='index.html'" class="px-4 py-2 bg-green-800 hover:bg-green-700 text-xs font-bold rounded-xl transition-all">
                    Back to App
                </button>
            </div>
        </div>

        <!-- Login Card (Shown if not logged in) -->
        <div id="admin-login-card" class="bg-gray-900 border border-green-900/60 rounded-3xl p-6 shadow-2xl max-w-md mx-auto hidden text-center">
            <div class="w-12 h-12 bg-green-500/20 border border-green-500 rounded-full flex items-center justify-center mx-auto mb-3 text-green-400 text-lg">
                <i class="fas fa-lock"></i>
            </div>
            <h2 class="text-lg font-bold text-white mb-1">Admin Authentication Required</h2>
            <p class="text-xs text-gray-400 mb-4">Please log in with your account to view and verify pending deposits.</p>
            <button onclick="window.location.href='index.html'" class="w-full py-3 bg-green-600 hover:bg-green-500 text-white font-bold rounded-xl text-xs shadow-lg">
                Go to Main App & Log In
            </button>
        </div>

        <!-- Pending Deposits Container -->
        <div id="admin-dashboard-container" class="bg-gray-900 border border-green-900/60 rounded-3xl p-6 shadow-2xl hidden">
            <h2 class="text-sm font-bold text-green-300 mb-4 flex items-center gap-2">
                <i class="fas fa-clock"></i> Pending Payment Requests
            </h2>

            <div id="admin-deposit-list" class="flex flex-col gap-4">
                <div class="text-center py-12 text-gray-500 text-xs">
                    <i class="fas fa-spinner fa-spin text-lg mb-2 text-green-500"></i>
                    <p>Loading pending deposits...</p>
                </div>
            </div>
        </div>

    </div>

    <!-- Admin Script Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";
        import { getFirestore, collection, query, where, getDocs, doc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDZb4KcR5Tvw3x_ipR2ocgdUDqh47Arz6M",
            authDomain: "anp-money.firebaseapp.com",
            projectId: "anp-money",
            storageBucket: "anp-money.firebasestorage.app",
            messagingSenderId: "581687927989",
            appId: "1:581687927989:web:41218431483f24a18b0afc"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                document.getElementById("admin-login-card").classList.remove("hidden");
                document.getElementById("admin-dashboard-container").classList.add("hidden");
                document.getElementById("admin-user-email").innerText = "Not Logged In";
                return;
            }

            document.getElementById("admin-login-card").classList.add("hidden");
            document.getElementById("admin-dashboard-container").classList.remove("hidden");
            document.getElementById("admin-user-email").innerText = user.email;

            loadPendingDeposits();
        });

        async function loadPendingDeposits() {
            const container = document.getElementById("admin-deposit-list");
            container.innerHTML = `<div class="text-center py-8 text-gray-500 text-xs">Fetching records...</div>`;

            try {
                const q = query(collection(db, "deposits"), where("status", "==", "pending"));
                const querySnapshot = await getDocs(q);

                container.innerHTML = "";

                if (querySnapshot.empty) {
                    container.innerHTML = `
                        <div class="text-center py-12 text-gray-500 text-xs">
                            <i class="fas fa-check-circle text-2xl text-green-600 mb-2"></i>
                            <p>No pending payment requests right now!</p>
                        </div>
                    `;
                    return;
                }

                querySnapshot.forEach((docSnap) => {
                    const deposit = docSnap.data();
                    const depositId = docSnap.id;
                    const dateStr = deposit.createdAt ? new Date(deposit.createdAt).toLocaleString('en-IN') : 'Recent';

                    const card = `
                        <div class="bg-black/40 border border-green-900/40 rounded-2xl p-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                            <div>
                                <div class="flex items-center gap-2 mb-1">
                                    <span class="text-xs font-bold text-white">${deposit.email || 'Partner'}</span>
                                    <span class="bg-yellow-500/20 text-yellow-300 text-[9px] font-bold px-2 py-0.5 rounded-full">Pending Verification</span>
                                </div>
                                <p class="text-xs text-gray-300">Package Price: <span class="font-extrabold text-green-400">₹${(deposit.amount || 0).toLocaleString()}</span></p>
                                <p class="text-xs text-gray-300">UTR Reference: <span class="font-mono text-yellow-300 font-bold bg-black/60 px-2 py-0.5 rounded">${deposit.utr}</span></p>
                                <p class="text-[10px] text-gray-500 mt-1">${dateStr}</p>
                            </div>
                            <button onclick="approveDeposit('${depositId}', '${deposit.uid}', ${deposit.amount})" class="w-full sm:w-auto px-5 py-2.5 bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-600 hover:to-emerald-700 text-white font-bold rounded-xl text-xs shadow-lg transition-all">
                                <i class="fas fa-check mr-1"></i> Verify & Activate VIP Pack
                            </button>
                        </div>
                    `;
                    container.innerHTML += card;
                });

            } catch (error) {
                console.error("Error loading pending deposits:", error);
                container.innerHTML = `<p class="text-red-400 text-xs text-center py-4">Error loading deposits: ${error.message}</p>`;
            }
        }

        // Updated Approval Logic: Sets Partner Level and Credits Daily Reward instead of pack cost
        window.approveDeposit = async function(depositId, userId, depositAmount) {
            let vipLevel = "VIP1";
            let dailyReward = 50;

            if (depositAmount >= 20000) {
                vipLevel = "VIP4";
                dailyReward = 2000;
            } else if (depositAmount >= 4999) {
                vipLevel = "VIP3";
                dailyReward = 500;
            } else if (depositAmount >= 1299) {
                vipLevel = "VIP2";
                dailyReward = 130;
            } else if (depositAmount >= 499) {
                vipLevel = "VIP1";
                dailyReward = 50;
            }

            if (!confirm(`Verify payment of ₹${depositAmount}?\n\nThis will activate partner tier [${vipLevel}] and credit daily reward of ₹${dailyReward} to their balance.`)) {
                return;
            }

            try {
                const userRef = doc(db, "users", userId);
                
                // Update user level and credit daily reward (Pack price is NOT added to spendable balance)
                await updateDoc(userRef, {
                    partnerLevel: vipLevel,
                    balance: increment(dailyReward),
                    todayEarnings: increment(dailyReward),
                    totalRevenue: increment(dailyReward)
                });

                // Mark deposit as approved
                const depositRef = doc(db, "deposits", depositId);
                await updateDoc(depositRef, {
                    status: "approved",
                    activatedLevel: vipLevel,
                    rewardCredited: dailyReward
                });

                alert(`Successfully activated ${vipLevel}! Daily reward of ₹${dailyReward} credited to partner balance.`);
                loadPendingDeposits();
            } catch (error) {
                alert("Error approving payment: " + error.message);
            }
        };
    </script>
</body>
</html>
